<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>解郁 · 职业大楼 · 3D 交互简历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='6' width='12' height='9' rx='1' fill='%23F4A982'/%3E%3Crect x='4' y='1' width='8' height='4' rx='1' fill='%23A79AE0'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #33322E;
    --ink-2: #6B675F;
    --paper: rgba(255, 254, 250, 0.94);
    --line: rgba(51, 50, 46, 0.14);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    background: linear-gradient(#BFE0FF 0%, #EAF3E4 55%, #FDF6EC 100%);
  }
  #app { position: fixed; inset: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* 左上角模拟案例标识 */
  .mock-corner {
    position: absolute; top: 14px; left: 14px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    pointer-events: none;
  }
  .mock-pill {
    background: #FFF3C4; border: 1px solid #C7A22E; color: #633806;
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
  }
  .mock-note { font-size: 11px; color: rgba(51,50,46,.55); background: rgba(255,254,250,.7); border-radius: 8px; padding: 3px 8px; }

  /* 恢复视角按钮（位于底部导航内，与导航按钮同风格） */
  #btn-cam { min-width: 44px; }
  #btn-cam:hover:enabled { background: rgba(51,50,46,.07); color: var(--ink); }
  #btn-cam:disabled { opacity: .35; }

  /* 底部导航 */
  #nav {
    position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 8; display: flex; align-items: center; gap: 6px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 10px; box-shadow: 0 6px 24px rgba(60, 52, 33, .14);
    max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none;
  }
  #nav::-webkit-scrollbar { display: none; }
  #nav button {
    min-height: 44px; border: none; background: transparent; color: var(--ink-2);
    font-size: 14px; font-family: inherit; border-radius: 999px; padding: 6px 12px;
    cursor: pointer; white-space: nowrap; transition: background .15s ease, color .15s ease;
  }
  #nav button:hover { background: rgba(51,50,46,.07); color: var(--ink); }
  #nav button.active { color: #fff; font-weight: 600; }
  #nav button.fpv-on { background: rgba(111,95,192,.16); color: #5B4BA8; font-weight: 600; }
  #nav button:disabled { opacity: .35; cursor: default; }
  #nav .sep { width: 1px; height: 22px; background: var(--line); flex: none; }
  #nav-status {
    font-size: 12px; color: var(--ink-2); padding: 0 8px; white-space: nowrap; flex: none;
    max-width: 170px; overflow: hidden; text-overflow: ellipsis;
  }

  /* 详情面板：桌面右侧 / 移动端底部抽屉 */
  #panel {
    position: absolute; top: 16px; right: 16px; bottom: 86px; width: 400px; z-index: 7;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(60, 52, 33, .18);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(calc(100% + 32px)); transition: transform .35s cubic-bezier(.22,.9,.3,1);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #panel.open { transform: translateX(0); }
  #panel .p-color { height: 8px; flex: none; background: #F4A982; }
  #panel header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px 10px; border-bottom: 1px solid var(--line);
  }
  #panel header .p-badge {
    flex: none; background: #FFF3C4; border: 1px solid #C7A22E; color: #633806;
    font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; letter-spacing: 1px;
  }
  #panel header h2 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; }
  #p-close {
    flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--ink-2); font-size: 17px; cursor: pointer; line-height: 1;
  }
  #p-close:hover { background: rgba(51,50,46,.07); color: var(--ink); }
  #p-back {
    flex: none; display: none; margin: 10px 16px 0; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-size: 13px; cursor: pointer;
    font-family: inherit; width: fit-content;
  }
  #p-back.show { display: block; }
  #p-body { flex: 1; overflow-y: auto; padding: 14px 16px 18px; font-size: 15px; line-height: 1.68; }
  #p-body h3 { margin: 18px 0 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  #p-body h3:first-child { margin-top: 2px; }
  #p-body p { margin: 0 0 10px; }
  /* 2F / 3F 正文中与岗位 JD 相关的关键词：加粗 + 比正文略深，让重点跳出来 */
  #p-body b { font-weight: 700; color: #26251F; }
  #p-body ul { margin: 0 0 12px; padding-left: 20px; }
  #p-body li { margin-bottom: 6px; }
  /* 项目正文用有序列表：内容较长时编号比圆点更易定位、便于口头引用「第 3 条」 */
  #p-body ol { margin: 0 0 12px; padding-left: 22px; }
  #p-body ol > li { margin-bottom: 8px; padding-left: 2px; }
  #p-body ol > li::marker { color: #6F5FC0; font-weight: 700; }
  .card {
    background: #fff; border: 1px solid var(--line); border-left: 4px solid #A79AE0;
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .card .c-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .card .c-sub { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .card .c-hint { font-size: 12px; color: var(--ink-2); }
  .card .c-label { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-top: 12px; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips span {
    background: rgba(111, 95, 192, .1); color: #5A4BA8;
    border: 1px solid rgba(111, 95, 192, .35);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500;
  }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; margin-bottom: 10px; }
  .kv .k { color: var(--ink-2); font-size: 13px; }
  .kv-copy {
    margin-left: 6px; padding: 1px 10px; font-size: 12px; font-family: inherit; line-height: 1.6;
    border: 1px solid rgba(111, 95, 192, .4); background: rgba(111, 95, 192, .08); color: #5B4BA8;
    border-radius: 999px; cursor: pointer; vertical-align: 1px; white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .kv-copy:hover { background: rgba(111, 95, 192, .18); }
  .kv-copy.copied { background: rgba(124, 197, 164, .22); border-color: rgba(63, 143, 102, .5); color: #2E7A55; }
  .job-head { font-weight: 600; }
  .job-time { font-size: 12.5px; color: var(--ink-2); font-weight: 400; margin-left: 8px; }
  .proj-entry {
    width: 100%; text-align: left; cursor: pointer; font-family: inherit; font-size: 15px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-left: 4px solid #A79AE0;
    border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; transition: transform .12s ease, box-shadow .12s ease;
  }
  .proj-entry:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(60,52,33,.10); }
  .proj-entry .pe-title { font-weight: 600; margin-bottom: 3px; }
  .proj-entry .pe-sub { font-size: 13px; color: var(--ink-2); }
  .proj-entry .pe-go { font-size: 12px; color: #6F5FC0; margin-top: 6px; }
  /* 在线版入口：与「本地内嵌原型」区分，用绿色系表示跑在云端、可实际调用 */
  .demo-live {
    display: block; margin-top: 8px; padding: 11px 12px; text-align: center;
    border-radius: 12px; border: 1px solid rgba(63,143,102,.45);
    background: rgba(63,143,102,.10); color: #2E7A55;
    font-size: 14px; font-weight: 600; text-decoration: none; line-height: 1.4;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .demo-live:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(60,52,33,.10); }
  .p-note { font-size: 12.5px; color: var(--ink-2); background: rgba(199,162,46,.10); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }

  /* ── 1F 个人简介：两块式布局 ──
     块① sec-t → .hl-box（能力速览 chips，整体给底 = 一整块）
     块② sec-t → .blks（能力说明卡片，flex gap 排列）
     节奏统一：两块「内部间距」都锁 8px，「块间距」都交给 .sec-t 的 margin */
  .sec-t {
    font-size: 11.5px; font-weight: 600; color: var(--ink-2);
    letter-spacing: .8px; margin: 16px 0 8px;
  }
  .sec-t:first-child { margin-top: 2px; }
  /* 块①：给整排 chips 一个底，让「一堆小框」在视觉上收成「一块」 */
  .hl-box {
    background: rgba(244,169,130,.06);
    border: 1px solid rgba(244,169,130,.24);
    border-radius: 12px; padding: 11px 12px;
  }
  .hl { display: flex; flex-wrap: wrap; gap: 8px; }
  .hl span {
    font-size: 12px; font-weight: 500; color: #8A5A34;
    background: rgba(244,169,130,.16); border: 1px solid rgba(244,169,130,.45);
    border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  }
  /* 块②：卡片组用 gap 统一排列，间距与 chips 内部一致（8px） */
  .blks { display: flex; flex-direction: column; gap: 8px; }
  .blk {
    background: #fff; border: 1px solid var(--line); border-left: 4px solid #A79AE0;
    border-radius: 12px; padding: 11px 13px;
  }
  .blk-h { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .blk-tag {
    flex: none; font-size: 11px; font-weight: 700; letter-spacing: .5px;
    color: #33322E; border-radius: 999px; padding: 2px 8px;
  }
  .blk-t { font-weight: 600; font-size: 14.5px; line-height: 1.4; }
  .blk-p { font-size: 14px; line-height: 1.66; color: var(--ink); }
  /* 领读卡：个人定位，用 1F 主色做底，与后面 5 张详情卡区分开 */
  .blk--lead { background: rgba(244,169,130,.13); border-color: rgba(244,169,130,.4); }
  .blk--lead .blk-p { font-size: 14.5px; line-height: 1.72; }

  @media (max-width: 768px) {
    #panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 70vh;
      border-radius: 20px 20px 0 0; border-left: none; border-right: none; border-bottom: none;
      transform: translateY(110%);
    }
    #panel.open { transform: translateY(0); }
    #p-body { font-size: 15px; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    #nav { bottom: max(8px, env(safe-area-inset-bottom)); padding: 6px 8px; gap: 2px; z-index: 8; }
    #nav button { padding: 6px 9px; font-size: 13px; }
    #nav-status { display: none; }
    .mock-corner { top: 10px; left: 10px; }
    .mock-note { max-width: 44vw; }
  }

惯用数据和复盘推动整改闭环。"}]},skills:{title:"核心技能",blocks:[{h:"AI Agent：从会用到会设计",text:"能独立设计 agent，不只是调用工具：为供应链场景编写<b>订单解析 Agent 的系统 prompt</b>（消息分类、交付日期锚定、歧义清单、防注入），采用<b>「LLM 负责理解、规则负责校验」</b>的双层架构，并用扣子（Coze）搭出<b>客服接单助手</b>与订单原型联动。常用工具包括 Trae、豆包、WorkBuddy、扣子/Coze、妙搭、<b>飞书多维表格 + AI</b>、<b>腾讯云函数（SCF）</b>；此前用 Claude Code 搭建过电销新人话术陪练助手（陪练覆盖率 <b>100%</b>、新人达标周期<b>缩短 1 个月</b>）。"},{h:"SOP 与流程体系搭建",text:"主导过服务、<b>库存</b>、<b>品控</b>三类标准化 SOP 的建立与落地，推动高频问题<b>标准化沉淀</b>。"},{h:"项目统筹与落地计划",text:"有服务场景 <b>AI 工作流</b>、新店开荒、区域门店统筹、<b>供应链订单自动化</b>四类项目的完整操盘经验，习惯<b>「目标拆解 → 行动计划 → 复盘迭代 → 整改闭环」</b>的推进方式；可独立编排 <b>WBS、甘特图与里程碑</b>，并维护<b>风险登记表</b>、明确「不做什么」的<b>范围边界</b>。"},{h:"跨部门沟通协调",text:"长期协调<b>前后厨</b>、市场部、平台方（美团/饿了么/大众点评）、总部财务等多方角色，推动<b>跨团队协作</b>落地。"},{h:"供应链计划与库存管理",text:"门店端有物料<b>进销存</b>、<b>周度盘点与账实核对</b>、<b>低效 SKU 数据化迭代</b>的完整实操；并主动补齐链条端方法——用<b>在住人数（OCC）驱动需求预测</b>，按<b>损耗与缺货两条线权衡库存</b>，把业务动作沉淀为可校验的<b>异常规则</b>（按损耗 / 缺货分级，红色项强制转人工）。"},{h:"数据化运营与系统集成",text:"从工单与客户反馈数据<b>定位服务堵点</b>，基于销售数据做<b>经营分析与 SKU 决策</b>；也能把数据沉淀进系统——打通<b>飞书多维表格</b>作为<b>数据中台</b>（多表双向同步），并用<b>腾讯云函数（SCF）</b>搭 <b>API 代理</b>解决浏览器直连的 CORS 限制。"}]},jobs:{title:"工作经历",items:[{company:"生活魔方（深圳）科技有限公司",role:"客户运营经理",time:"2025.05–2026.08",bullets:["统筹 60+ 名母婴护理师与对应客户的双边协调运营：梳理<b>供需匹配规则</b>（技能等级 × 服务半径 × 时效窗口）、优化<b>派单调度</b>流程，月均协调派单 <b>30+ 次</b>，将派单从人工经验判断转为<b>规则驱动</b>；","主导客诉与舆情管理，月均处理客诉 <b>7 起</b>（<b>重大舆情零发酵</b>），定位服务问题并推动<b>整改闭环</b>，维护服务口碑与客户关系；","基于公司自研系统（后台 + App + 企微/飞书知识库 + 小程序）建立<b>标准化服务流程</b>与 <b>FAQ 知识库</b>，从工单与客户反馈数据中定位服务堵点并推动高频问题标准化沉淀，<b>降低重复人工答疑</b>与协调成本；","负责团队晋升辅导、技能培训与绩效评估，建立<b>分层培养机制与人才盘点</b>，保持人员健康流动与服务质量稳定。"]},{company:"瑞幸咖啡（深圳）有限公司",role:"门店店长",time:"2023.08–2025.04",bullets:["主导门店运营管理，<b>拆解年度/季度/月度经营目标</b>并制定<b>行动计划</b>，定期组织会议<b>复盘</b>；任职期间在深圳 1200+ 门店中<b>综合排名第 9</b>，各项 KPI 完成率保持 <b>95% 以上</b>，获「年度优秀店长」；","<b>短保库存</b>与品控体系：建立「订货—收货—存储—效期巡检—报废」<b>全链路 SOP</b>，覆盖鲜奶、轻食等<b>短保 SKU</b>；主导<b>周度/月度盘点</b>，库存差异按人 / 批次 / 流程三类<b>根因定位并闭环</b>，任期内食安与品控<b>零事故</b>；","<b>需求校准与缺货治理</b>：基于历史销量叠加天气、节假日、促销等因素校准系统<b>订货建议量</b>，缓解高峰期<b>缺货</b>与低谷期<b>报废   .fs-sync-card { display:flex !important; flex-direction:row !important; align-items:center !important; gap:12px !important; }

  .coze-fab {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }
  .coze-fab-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #B8956A, #D4A859);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(184, 149, 106, 0.4);
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .coze-fab-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 36px rgba(184, 149, 106, 0.55);
  }
  .coze-fab-btn .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #E74C3C;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
  }
  .coze-panel {
    width: 380px;
    height: 560px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    overflow: hidden;
    display: none;
    flex-direction: column;
    animation: cozeSlideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(184, 149, 106, 0.2);
  }
  .coze-panel.open {
    display: flex;
  }
  @keyframes cozeSlideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .coze-panel-header {
    background: linear-gradient(135deg, #B8956A, #D4A859);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .coze-panel-header .title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .coze-panel-header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;

  .coze-panel-header .name {
    font-weight: 600;
    font-size: 15px;

    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;

    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .coze-panel-header .close-btn:hover {
    background: rgba(255, 255, 255, 0.35);
  }
  .coze-panel iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #FAFAF8;
  }
  .coze-fab-tip {
    background: #fff;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 12.5px;
    color: var(--text-soft);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    white-space: nowrap;
    animation: cozeTip 2.5s ease-in-out infinite;
  }
  @keyframes cozeTip {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @media (max-width: 480px) {
    .coze-panel { width: calc(100vw - 32px); height: 70vh; right: 0; }
    .coze-fab { right: 16px; bottom: 16px; }
  }

  /* ═══ 飞书数据中台卡片修复 ═══ */
  .fs-sync-card {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 12px !important;
  }
  .fs-sync-card .fs-sc-icon {
    flex-shrink: 0 !important;
    width: auto !important;
  }
  .fs-sync-card .fs-sc-body {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    width: auto !important;
  }
  .fs-sync-card .fs-sc-title {
    white-space: normal !important;
    writing-mode: horizontal-tb !important;
    width: auto !important;
  }
  .fs-sync-card .fs-btn {
    flex-shrink: 0 !important;
    width: auto !important;
    display: inline-block !important;
  }
  /* ═══════  奢华酒店设计系统  ═══════ */
  :root {
    /* 底色 — 象牙白 */
    --bg: #FAF8F5;
    --bg-soft: #F3EFE9;
    /* 表面 — 米白哑光 */
    --surface: #FFFFFF;
    --surface-alt: #FBF9F6;
    /* 文字 — 炭灰 */
    --text: #1C1917;
    --text-soft: #44403C;
    --text-muted: #78716C;
    --text-faint: #A8A29E;
    /* 主金 — 拉丝黄铜 */
    --gold: #B8956A;
    --gold-deep: #9A7B52;
    --gold-light: #D4BFA0;
    --gold-soft: #EDE4D3;
    --gold-bg: #FAF6EF;
    /* 强调色 — 深藏青 */
    --navy: #1E2A3A;
    --navy-deep: #141E2B;
    --navy-soft: #2D3B4F;
    --navy-bg: #F0F3F7;
    /* 状态色 — 低饱和 */
    --green: #4A6741;
    --green-soft: #D4DFD0;
    --green-bg: #F3F6F1;
    --amber: #92662A;
    --amber-soft: #E8D5B7;
    --amber-bg: #FAF4EA;
    --red: #8B3A3A;
    --red-soft: #E0C5C5;
    --red-bg: #F8EFEE;
    --stone: #6B6560;
    --stone-soft: #D6D3CF;
    --stone-bg: #F2F0ED;
    /* 线条 */
    --border: #E5DED2;
    --border-soft: #EFEAE2;
    --border-gold: #D4BFA0;
    /* 阴影 — 极克制 */
    --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.04);
    --shadow-md: 0 4px 16px -4px rgba(28, 25, 23, 0.06);
    --shadow-lg: 0 12px 32px -8px rgba(28, 25, 23, 0.08);
    /* 圆角 — 小而精致 */
    --radius-sm: 3px;
    --radius-md: 6px;
    --radius-lg: 8px;
    /* 字体 */
    --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
    --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-serif-cn: 'Noto Serif SC', 'Playfair Display', Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.75;
    padding: 48px 28px 80px;
    position: relative;
    min-height: 100vh;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* 背景 — 极淡亚麻纹理 + 边角柔光 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(184, 149, 106, 0.05) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(30, 42, 58, 0.03) 0%, transparent 50%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.25;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ═══════  排版  ═══════ */
  h1 {
    font-family: var(--font-serif-cn);
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--navy);
    line-height: 1.35;
    text-align: center;
  }

  h1 em {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    color: var(--gold);
    font-size: 0.75em;
    letter-spacing: 0;
    margin: 0 4px;
  }

  h2 {
    font-family: var(--font-serif-cn);
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--navy);
    text-align: center;
    letter-spacing: 0.15em;
    position: relative;
    padding-bottom: 16px;
  }

  h2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 1px;
    background: var(--gold);
  }

  .sub {
    color: var(--text-soft);
    font-size: 13px;
    margin-top: 12px;
    line-height: 1.8;
    font-weight: 400;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ═══════  卡片  ═══════ */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.4s ease;
    position: relative;
  }

  .card:hover {
    box-shadow: var(--shadow-md);
  }

  /* Hero 区 — 大气尊贵 */
  .hero {
    background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
    border: none;
    border-radius: var(--radius-lg);
    padding: 56px 40px 48px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
    color: #fff;
    box-shadow: var(--shadow-lg);
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 50% 80% at 15% 50%, rgba(184, 149, 106, 0.15) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 85% 80%, rgba(184, 149, 106, 0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    top: 24px; left: 24px; right: 24px; bottom: 24px;
    border: 1px solid rgba(184, 149, 106, 0.25);
    border-radius: var(--radius-md);
    pointer-events: none;
  }

  .hero h1 {
    color: #fff;
    position: relative;
    z-index: 1;
    font-weight: 400;
  }

  .hero h1 em {
    color: var(--gold-light);
  }

  .hero .sub {
    color: rgba(255, 255, 255, 0.55);
    position: relative;
    z-index: 1;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  .hero .ornament {
    text-align: center;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 8px;
    margin: 14px 0 4px;
    position: relative;
    z-index: 1;
    opacity: 0.8;
  }

  /* 标签 — 极简金线 */
  .pill {
    display: inline-block;
    padding: 5px 16px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 2px;
    margin-left: 14px;
    vertical-align: middle;
    font-family: var(--font-body);
  }

  .hero .pill {
    color: var(--gold-light);
    border-color: rgba(184, 149, 106, 0.5);
    background: transparent;
  }

  /* ═══════  统计数据  ═══════ */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    margin-bottom: 24px;
    background: var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }

  .stat {
    background: var(--surface);
    padding: 26px 20px 24px;
    text-align: center;
    transition: background 0.3s ease;
    position: relative;
  }

  .stat:hover {
    background: var(--surface-alt);
  }

  .stat::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .stat:hover::after {
    opacity: 1;
  }

  .stat b {
    display: block;
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 400;
    line-height: 1.1;
    color: var(--navy);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .stat span {
    display: block;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 400;
    margin-top: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ═══════  流程步骤  ═══════ */
  .flow {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    margin-bottom: 24px;
    position: relative;
  }

  .flow div {
    background: var(--surface);
    border: 1px solid var(--border);
    border-right: none;
    padding: 20px 18px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-soft);
    transition: all 0.3s ease;
    position: relative;
    font-weight: 400;
  }

  .flow div:first-child {
    border-top-left-radius: var(--radius-lg);
    border-bottom-left-radius: var(--radius-lg);
  }

  .flow div:last-child {
    border-right: 1px solid var(--border);
    border-top-right-radius: var(--radius-lg);
    border-bottom-right-radius: var(--radius-lg);
  }

  .flow div:hover {
    background: var(--gold-bg);
    color: var(--text);
    z-index: 1;
  }

  .flow div span {
    display: block;
    color: var(--gold);
    font-size: 10.5px;
    font-weight: 500;
    margin-bottom: 7px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: var(--font-body);
  }

  /* ═══════  消息卡片  ═══════ */
  .msgs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .msg {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    display: flex;
    flex-direction: column;
    transition: all 0.35s ease;
    position: relative;
  }

  .msg:hover {
    border-color: var(--gold-light);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .msg .from {
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 400;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .msg-tag {
    font-size: 10px;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: none;
  }
  .tag-red { background: linear-gradient(135deg, #EF4444, #F97316); color: #fff; }
  .tag-yellow { background: var(--gold-50); color: var(--gold); }
  .tag-blue { background: #EFF6FF; color: #2563EB; }
  .tag-purple { background: #F5F3FF; color: #7C3AED; }
  .tag-gray { background: var(--bg-soft); color: var(--text-faint); }

  .msg .body {
    font-family: var(--font-serif-cn);
    font-size: 14px;
    line-height: 1.85;
    flex: 1;
    color: var(--text-soft);
    font-weight: 400;
    padding: 4px 0 14px;
    font-style: normal;
  }

  /* ═══════  按钮  ═══════ */
  button {
    margin-top: 12px;
    width: 100%;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 11px 0;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }

  button:hover:not(:disabled) {
    background: var(--navy-deep);
    border-color: var(--navy-deep);
  }

  button:disabled {
    background: var(--stone-bg);
    color: var(--text-faint);
    border-color: var(--border);
    cursor: default;
  }

  /* ═══════  回执  ═══════ */
  .rcpt {
    display: none;
    margin-top: 12px;
    background: var(--green-bg);
    border: 1px solid var(--green-soft);
    border-left: 3px solid var(--green);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 12px 16px;
    font-size: 12.5px;
    color: var(--green);
    line-height: 1.75;
    animation: fadeInUp 0.4s ease;
    font-weight: 400;
  }

  .rcpt.show { display: block; }

  .rcpt b {
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.05em;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ═══════  小按钮  ═══════ */
  .mini {
    display: inline-block;
    width: auto;
    margin: 5px 6px 0 0;
    padding: 6px 16px;
    font-size: 11.5px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-weight: 400;
    letter-spacing: 0.05em;
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .mini:hover {
    border-color: var(--gold);
    color: var(--gold-deep);
    background: var(--gold-bg);
  }

  /* ═══════  自由输入  ═══════ */
  .free textarea {
    width: 100%;
    height: 84px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-family: var(--font-serif-cn);
    font-size: 14px;
    resize: vertical;
    margin-bottom: 12px;
    background: var(--surface-alt);
    color: var(--text);
    transition: all 0.3s ease;
    line-height: 1.7;
    font-weight: 400;
  }

  .free textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(184, 149, 106, 0.1);
  }

  .free textarea::placeholder {
    color: var(--text-faint);
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* ═══════  工具栏  ═══════ */
  .bar {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .bar button {
    width: auto;
    margin-top: 0;
    padding: 9px 24px;
  }

  .btn-ghost {
    background: transparent;
    color: var(--navy);
    border-color: var(--navy);
  }

  .btn-ghost:hover:not(:disabled) {
    background: var(--navy);
    color: #fff;
  }

  /* 分段控件 */
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--surface);
  }

  .seg button {
    border: none;
    border-radius: 0;
    margin: 0;
    background: transparent;
    color: var(--text-muted);
    padding: 8px 18px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: none;
  }

  .seg button:hover:not(.on) {
    background: var(--surface-alt);
    color: var(--text-soft);
    box-shadow: none;
    transform: none;
  }

  .seg button.on {
    background: var(--navy);
    color: #fff;
  }

  .lbl {
    font-size: 12.5px;
    color: var(--text-soft);
    font-weight: 400;
    letter-spacing: 0.03em;
  }

  /* ═══════  表格  ═══════ */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    font-weight: 400;
  }

  th {
    text-align: left;
    font-weight: 500;
    color: var(--text-soft);
    padding: 14px 14px;
    border-bottom: 1px solid var(--border-gold);
    white-space: nowrap;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
  }

  td {
    padding: 14px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
    transition: background 0.25s ease;
    color: var(--text-soft);
  }

  tr:hover td {
    background: var(--surface-alt);
  }

  tr:last-child td { border-bottom: none; }

  .grp td {
    font-weight: 500;
    background: var(--surface-alt);
    font-size: 12px;
    color: var(--navy);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: var(--font-body);
  }

  tr.grp:hover td {
    background: var(--surface-alt);
  }

  /* ═══════  状态点与标签  ═══════ */
  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 2px;
  }

  .d-red { background: var(--red); }
  .d-yellow { background: var(--amber); }
  .d-green { background: var(--green); }
  .d-gray { background: var(--stone); }

  .tag {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 2px;
    font-size: 11px;
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }
  .urgent-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 600;
    background: linear-gradient(135deg, #EF4444, #F97316);
    color: #fff;
    margin-left: 6px;
    vertical-align: middle;
    animation: urgentPulse 2s ease-in-out infinite;
  }
  @keyframes urgentPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .t-red {
    background: var(--red-bg);
    color: var(--red);
    border-color: var(--red-soft);
  }
  .t-yellow {
    background: var(--amber-bg);
    color: var(--amber);
    border-color: var(--amber-soft);
  }
  .t-green {
    background: var(--green-bg);
    color: var(--green);
    border-color: var(--green-soft);
  }
  .t-gray {
    background: var(--stone-bg);
    color: var(--stone);
    border-color: var(--stone-soft);
  }

  .note {
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 400;
    line-height: 1.7;
  }

  .overridden td {
    color: var(--text-faint);
    text-decoration: line-through;
  }

  .empty {
    color: var(--text-faint);
    font-size: 13px;
    padding: 32px 0;
    text-align: center;
    font-weight: 300;
    font-style: italic;
    font-family: var(--font-display);
    letter-spacing: 0.04em;
  }

  /* ═══════  双栏布局  ═══════ */
  .two {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
  }

  /* ═══════  折叠面板  ═══════ */
  details {
    margin-bottom: 20px;
  }

  details summary {
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 400;
    padding: 18px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    list-style: none;
    transition: all 0.3s ease;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-serif-cn);
    letter-spacing: 0.06em;
    box-shadow: var(--shadow-sm);
  }

  details summary:hover {
    border-color: var(--gold-light);
    color: var(--gold-deep);
  }

  details summary::-webkit-details-marker { display: none; }

  details summary::before {

  /* 知识库分类（手风琴） */

  .kb-search-box {

  .kb-search-box input {

  @keyframes fadeIn {

  /* ═══════  时间线  ═══════ */
  .tl {

    gap: 0;
    position: relative;
    padding: 32px 0 8px;

  .tl::before {

  /* ═══════  表格滚动容器  ═══════ */

  .msgs .msg:nth-child(3) { animation-delay: 0.71s; }
  .two:nth-of-type(1) .card:nth-child(1) { animation-delay: 0.65s; }
  .two:nth-of-type(1) .card:nth-child(2) { animation-delay: 0.73s; }
  .two:nth-of-type(2) .card:nth-child(1) { animation-delay: 0.75s; }
  .two:nth-of-type(2) .card:nth-child(2) { animation-delay: 0.83s; }
  .tl .tl-i:nth-child(1) { animation-delay: 0.8s; }
  .tl .tl-i:nth-child(2) { animation-delay: 0.86s; }
  .tl .tl-i:nth-child(3) { animation-delay: 0.92s; }
  .tl .tl-i:nth-child(4) { animation-delay: 0.98s; }
  .tl .tl-i:nth-child(5) { animation-delay: 1.04s; }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 数字微动 */
  @keyframes countPulse {
    0% { color: var(--navy); }
    50% { color: var(--gold); }
    100% { color: var(--navy); }
  }

  .stat.bump b {
    animation: countPulse 0.5s ease;
  }

  /* ═══════  飞书同步  ═══════ */
  .feishu-config {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .fs-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .fs-row input {

  .fs-status.fs-err { background: rgba(207, 34, 46, 0.12); color: #cf222e; }

  .fs-grid {
    display: grid;

  .fs-sc-body { flex: 1; min-width: 0; }
  .fs-sc-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);

  }
  .fs-sc-desc {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .fs-btn {
    flex-shrink: 0;
    padding: 7px 14px;
    font-size: 11.5px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text-soft);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .fs-btn-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .fs-btn-group .fs-btn {
    padding: 7px 12px;
  }
  .fs-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(184, 149, 106, 0.06);
  }
  .fs-btn:disabled {

  }
  .fs-btn-primary {

  }
  .fs-btn-primary:hover {
    background: #2a3a50;
    border-color: #2a3a50;
    color: #fff;
  }
  .fs-btn-gold {

    background: var(--accent);
    color: #fff;

  }
  .fs-btn-gold:hover {

  /* ═══════  响应式  ═══════ */
  @media (max-width: 760px) {

  /* ═══ 扣子 AI 助手悬浮窗 ═══ */

<body>
<div class="wrap">

  \x3C!-- ═══  Hero  ═══ -->
  <div class="card hero">
    <div class="ornament">❖ ❖ ❖</div>
    <h1>酒店早餐订单<em>&amp;</em>风险评估<span class="pill">Prototype</span></h1>
    <div class="sub">非结构化下单 → 结构化订单 · 自动回执 · 需求预测比对 · 人工复核闭环 · 分供应商采购汇总</div>
  </div>

  \x3C!-- ═══  统计数据  ═══ -->
  <div class="stats">
    <div class="stat" id="stat1"><b id="s1">0</b><span>已解析订单行</span></div>
    <div class="stat" id="stat2"><b id="s2">0</b><span>待人工复核项</span></div>
    <div class="stat" id="stat3"><b id="s3">0</b><span>预测偏离预警</span></div>
    <div class="stat" id="stat4"><b id="s4">0</b><span>替代人工耗时 · 分钟/天</span></div>
  </div>

  \x3C!-- ═══  流程步骤  ═══ -->
  <div class="flow">
    <div><span>Step 01</span>语义解析<br>门店 / SKU / 数量 / 变更指令</div>
    <div><span>Step 02</span>别名映射<br>口语 → SKU 主数据</div>
    <div><span>Step 03</span>规则校验<br>偏离预警线 → 标红</div>
    <div><span>Step 04</span>预测比对<br>自动回执防漏单</div>
    <div><span>Step 05</span>复核闭环<br>人工确认 → 采购汇总</div>
  </div>

  \x3C!-- ═══  知识库折叠  ═══ -->
  <details>
    <summary>知识库 · SKU 主数据与别名映射表（47 项）</summary>
    <div class="inner">
      <div class="kb-search-box">
        <input type="text" id="kbSearch" placeholder="🔍 搜索 SKU 名称、别名、供应商..." oninput="renderKb()">
      </div>
      <div class="kb-stats" id="kbStats" style="margin-bottom:14px"></div>
      <div class="kb-accordion" id="kbAccordion"></div>

function guests(s) { var o = STORES[s]; return Math.round(o.occ * o.rate) + o.extra; }
function forecast(s, k) { return guests(s) * SKU[k].pp; }
function fmt(n) { return (Math.round(n * 10) / 10).toString(); }
function dot(c) { return '<span class="dot d-' + c + '"></span>'; }
function tag(c, t) { return '<span class="tag t-' + c + '">' + t + '</span>'; }

function statusOf(i) {
  if (i.confirmed) return 'green';
  if (i.kind === 'cancel' || i.kind === 'nonstd') return 'red';
  if (i.kind === 'fuzzy' || i.kind === 'history' || i.qty === null || i.qty === undefined) return 'yellow';
  var f = forecast(i.store, i.sku);
  if (f <= 0) return 'red';
  return Math.abs((i.qty - f) / f) >= state.th ? 'red' : 'green';
}

function pushItems(store, items) {
  var fresh = [];
  items.forEach(function (it) {
    var itemStore = it.store || store;
    state.items.forEach(function (old) {
      if (!old.overridden && old.store === itemStore && old.sku === it.sku) {
        old.overridden = true;
        old.note = '已被后续指令覆盖';
      }
    });
    var rec = { store:itemStore, sku:it.sku, qty:it.qty, kind:it.kind, why:it.why, overridden:false, note:'', confirmed:false, uid:++state.seq, urgent: it.urgent };
    state.items.push(rec);
    fresh.push(rec);
  });
  return fresh;
}

function guessSkuCat(name, supplier) {
  name = name || '';
  supplier = supplier || '';
  // 优先级：bakery > chinese > dairy > egg > meat > drink > fruit > vege
  if (/面包|吐司|牛角|餐包|蛋糕|蛋挞|小贝|可颂|麦芬|曲奇|饼干/.test(name)) return 'bakery';
  if (/粥|包子|馒头|油条|炒粉|蒸饺|饺子|素食|素餐|豆浆|咸菜|酱菜|泡菜|卤蛋|茶叶蛋|茶蛋|炒面|炒饭|烧麦|包子|肉包/.test(name)) return 'chinese';
  if (/牛奶|酸奶|奶油|黄油|芝士|奶酪|奶|milk|yogurt|cream|butter/i.test(name)) return 'dairy';
  if (/鸡蛋|蛋|鹌鹑蛋|皮蛋|egg/i.test(name) && !/蛋糕/.test(name)) return 'egg';
  if (/培根|香肠|火腿|午餐肉|烟肉|bacon|sausage|ham/i.test(name)) return 'meat';
  if (/咖啡|茶|果汁|果酱|燕麦|麦片|玉米片|蜂蜜|花生酱|榨菜|coffee|tea|juice|jam|honey/i.test(name)) return 'drink';
  if (/香蕉|苹果|橙|西瓜|哈密瓜|葡萄|圣女果|小番茄|莓|桃|梨|菠萝|榴莲|芒果|果/.test(name) && !/果酱|果汁/.test(name)) return 'fruit';
  if (/蔬菜|生菜|番茄|黄瓜|青菜|时蔬|沙拉|菜/.test(name) && !/榨菜|咸菜/.test(name)) return 'vege';
  return 'drink'; // 默认归饮品调料
}

function receiveCozeOrder(order, messageOrderId) {
  if (!order || !Array.isArray(order.ops)) return { ok:false, reason:'订单数据格式不完整' };
  var orderId = String(messageOrderId || order.order_id || order.id || ('coze-' + Date.now()));
  if (state.receivedOrderIds[orderId]) return { ok:false, duplicate:true, reason:'该订单已接收' };
  state.receivedOrderIds[orderId] = true;

  var store = storeNameFromAgent(order.store_id || order.store);
  if (!store) {
    state.meta.push({ t:'扣子订单门店待确认', v:'订单 ' + orderId + ' 未匹配到唯一门店', store:'-', done:false, mi:state.meta.length });
    render();
    return { ok:false, reason:'门店无法匹配' };
  }

  var parsed = [];
  var invalid = [];
  order.ops.forEach(function (op) {
    var sku = skuKeyFromAgent(op.sku_code || op.sku_key);
    if (!sku || !SKU[sku]) {
      invalid.push(op.raw || op.sku_code || '未知 SKU');
      return;
    }
    var action = String(op.op || 'unknown').toLowerCase();
    var kind = action === 'cancel' ? 'cancel' : (action === 'unknown' || op.fuzzy || op.qty == null ? 'fuzzy' : 'computed');
    var qty = action === 'cancel' ? 0 : op.qty;
    var why = '扣子 Agent 已确认，进入 Demo 复核' + (op.note ? '：' + op.note : '');
    if (op.raw) why += ' · 原话：' + op.raw;
    if (op.fuzzy) why += ' · 模糊类型：' + op.fuzzy;
    parsed.push({ sku:sku, qty:qty, kind:kind, why:why, externalOrderId:orderId, deliveryDate:order.delivery_date || null, urgent:!!order.urgent, confirmed:true });
  });

  if (invalid.length) {
    state.meta.push({ t:'扣子订单 SKU 待确认', v:'未匹配：' + invalid.join('、'), store:store, done:false, mi:state.meta.length });
  }
  if (!parsed.length) {
    state.meta.push({ t:'扣子订单未入表', v:'没有可映射的 SKU，已转人工', store:store, done:false, mi:state.meta.length });
    render();
    return { ok:false, reason:'没有可映射 SKU' };
  }

  var fresh = pushItems(store, parsed);
  fresh.forEach(function (item) { item.source = 'coze'; item.agentOrderId = orderId; });
  if (order.ambiguities && order.ambiguities.length) {
    state.meta.push({ t:'扣子订单存在歧义', v:order.ambiguities.join('；'), store:store, done:false, mi:state.meta.length });
  }
  showReceipt('rcFree', '<b>【扣子 Agent 已接收】</b>' + escapeExternal(store) + ' · ' + escapeExternal(order.delivery_date || '日期待补充') + ' · 已加入结构化订单，正在同步飞书...');
  render();

  // 自动同步到飞书
  if (typeof syncToFeishu === 'function') {
    setTimeout(function () {
      syncToFeishu('order').then(function () {
        showReceipt('rcFree', '<b>【扣子 Agent 已接收 · 已同步飞书】</b>' + escapeExternal(store) + ' · ' + fresh.length + ' 条订单已写入飞书多维表格。');
      }).catch(function (err) {
        state.meta.push({ t:'扣子订单同步飞书失败', v:err.message || '未知错误，请检查代理服务连接', store:store, done:false, mi:state.meta.length });
        showReceipt('rcFree', '<b>【扣子 Agent 已接收 · 同步失败】</b>订单已加入表格，但写入飞书失败：' + escapeExternal(err.message || '请检查代理服务连接'));
        render();
      });
    }, 300);
  }

  return { ok:true, orderId:orderId, count:fresh.length };
}

function handleCozeMessage(event) {
  // 仅信任扣子 iframe 的来源；event.source 不做固定判断，兼容嵌入与独立页面两种形态。
  if (COZE_ALLOWED_ORIGINS.indexOf(event.origin) < 0) return;
  var data = event.data || {};
  if (data.source !== 'morning-breakfast-agent') return;
  if (data.type === 'breakfast_order_confirm') {
    receiveCozeOrder(data.order, data.order_id);
  } else if (data.type === 'breakfast_order_cancel') {
    var cancelId = String(data.order_id || '未知');
    if (state.receivedOrderIds[cancelId]) {
      delete state.receivedOrderIds[cancelId];
    }
    state.meta.push({ t:'扣子订单取消', v:'订单 ' + escapeExternal(cancelId) + ' 已取消，未写入新订单', store:'-', done:false, mi:state.meta.length });
    render();
  }
}

function buildReceipt(store, items) {
  var parts = items.map(function (i) {
    var s = SKU[i.sku], st = statusOf(i);
    var mark = (st === 'red' || st === 'yellow') ? '（待您确认）' : '';
    if (i.qty === 0) return s.name + '：整项取消（待确认是否永久下架）';
    return s.name + ' ' + i.qty + s.unit + mark;
  });
  return '<b>【自动回执 · 已发回门店】</b>' + store + ' 2026-10-16 订单已登记：' + parts.join('；') +
    '。如与您的需求不符，请回复纠正；10 分钟未回复我们将电话确认。';
}

var CN = { '一':1, '二':2, '两':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10, '半':0.5, '零':0, '几':null, '数':null };
var UNITS = '箱|托|袋|盒|份|个|斤|kg|克|g|瓶|条|包|罐|杯|碗';
var URGENT_PAT = /(紧急|急着|尽快|马上|立刻|赶紧|加急|急)/;

function parseFree() {
  var text = (document.getElementById('freeText').value || '').trim();
  if (!text) { showReceipt('rcFree', '请输入一句下单内容，例如：福田店明天加三箱牛奶'); return; }

  var store = null;
  Object.keys(STORES).forEach(function (s) {
    STORES[s].keys.forEach(function (k) { if (text.indexOf(k) >= 0) store = s; });
  });
  if (!store) {
    state.meta.push({ t:'门店识别', v:'自由输入未识别到门店，整条转人工（下错门店=整单错，宁可不动）', store:'-', done:false, mi:state.meta.length });
    showReceipt('rcFree', '<b>【转人工】</b>未识别到门店，无法自动登记 —— 请指明门店（如：福田店 / 深圳湾店 / 王总）。');
    render();
    return;
  }

  var found = [];
  var names = [];
  Object.keys(SKU).forEach(function (k) { names.push({ a:SKU[k].name, k:k }); SKU[k].alias.split(' / ').forEach(function (a) { names.push({ a:a, k:k }); }); });
  names.sort(function (x, y) { return y.a.length - x.a.length; });
  names.forEach(function (n) {
    var p = text.indexOf(n.a);
    if (p < 0) return;
    var overlap = found.some(function (f) { return p >= f.p0 - 2 && p <= f.p1 + 2; });
    if (!overlap) found.push({ k:n.k, alias:n.a, p0:p, p1:p + n.a.length });
  });

  if (!found.length) {
    state.meta.push({ t:'SKU 识别', v:'自由输入未命中任何已知 SKU，整条转人工（语音/文字转写不清时同样兜底到人）', store:store, done:false, mi:state.meta.length });
    showReceipt('rcFree', '<b>【转人工】</b>识别到门店（' + store + '），但没有命中任何已知 SKU —— 已转人工处理，稍后回复您。');
    render();
    return;
  }

  var items = [];
  var hasUrgent = URGENT_PAT.test(text);
  found.forEach(function (f) {
    var before = text.slice(Math.max(0, f.p0 - 12), f.p0);
    var after = text.slice(f.p1, f.p1 + 12);
    var qty = null, op = 'set';
    var unitRe = new RegExp('(' + UNITS + ')?');
    var numRe = new RegExp('(\\\\d+(?:\\\\.\\\\d+)?|[一两二三四五六七八九十半零]+)\\\\s*' + unitRe.source);
    var mPre = before.match(numRe.source + '\\\\s*$');
    var mAft = after.match('^\\\\s*' + numRe.source);

    var nearCancel = /不要|取消|去掉|不用|停|没了/.test(text.slice(Math.max(0, f.p0 - 12), f.p1 + 12));
    var nearHalf = /减半/.test(text);
    var nearDouble = /(翻倍|加一倍|来两份|双份|双)/.test(text);
    var nearReplace = /(换成|改|换做|改成)/.test(text);
    var nearFuzzyMore = /(多来点|多要点|多备点|多拿点|多加|多一点|多些)/.test(text);
    var nearFuzzyLess = /(少来点|少要点|少备点|少拿点|少一点|少些)/.test(text);

    if (nearCancel) {
      var cancelScope = /以后|以后都|从今天|每天|以后每天/.test(text.slice(Math.max(0, f.p0 - 15), f.p1 + 15)) ? 'standing' : 'unknown';
      items.push({ sku:f.k, qty:0, kind:'cancel', why:'自由输入：检测到取消指令（"' + f.alias + '"附近），范围：' + (cancelScope === 'standing' ? '以后都不要' : '仅本次需确认'), urgent: hasUrgent });
      return;
    }

    var raw = mPre ? mPre[1] : (mAft ? mAft[1] : null);
    if (raw !== null && raw !== undefined) {
      qty = /^\\d/.test(raw) ? parseFloat(raw) : (CN[raw] !== undefined ? CN[raw] : null);
      if (raw === '半') qty = 0.5;
    }
    var fc = forecast(store, f.k);

    // 比例调整：减半
    if (nearHalf && !qty) {
      items.push({ sku:f.k, qty:fmt(fc * 0.5), kind:'computed', why:'自由输入：检测到"减半"，按建议量 ' + fmt(fc) + ' × 0.5', urgent: hasUrgent });
      return;
    }
    // 比例调整：翻倍
    if (nearDouble && !qty) {
      items.push({ sku:f.k, qty:fmt(fc * 2), kind:'computed', why:'自由输入：检测到"翻倍/加一倍"，按建议量 ' + fmt(fc) + ' × 2', urgent: hasUrgent });
      return;
    }

    if (qty === null || qty === undefined) {
      if (nearFuzzyMore) {
        items.push({ sku:f.k, qty:fmt(fc * 1.3), kind:'fuzzy', why:'自由输入：检测到"多来点"等模糊增量，按建议量 ×1.3 给参考值', urgent: hasUrgent });
      } else if (nearFuzzyLess) {
        items.push({ sku:f.k, qty:fmt(fc * 0.7), kind:'fuzzy', why:'自由输入：检测到"少来点"等模糊减量，按建议量 ×0.7 给参考值', urgent: hasUrgent });
      } else {
        items.push({ sku:f.k, qty:fmt(fc * 1.3), kind:'fuzzy', why:'自由输入：未识别到明确数量（模糊量），按建议量 ×1.3 给参考值', urgent: hasUrgent });
      }
    } else if (mPre && /(加|追加|增|加上)/.test(before)) {
      items.push({ sku:f.k, qty:fmt(fc + qty), kind:'computed', why:'自由输入：检测到"加"，建议量 ' + fmt(fc) + ' + ' + qty, urgent: hasUrgent });
    } else if (mPre && /(减|少|扣|去掉)/.test(before)) {
      items.push({ sku:f.k, qty:fmt(Math.max(0, fc - qty)), kind:'computed', why:'自由输入：检测到"减/少"，建议量 ' + fmt(fc) + ' − ' + qty, urgent: hasUrgent });
    } else {
      items.push({ sku:f.k, qty:qty, kind:'computed', why:'自由输入：识别到明确数量 ' + qty + (hasUrgent ? '（加急）' : ''), urgent: hasUrgent });
    }
  });

  // 替换指令处理（A换成B → A取消 + B加等量）
  if (/换成|改|换做|改成/.test(text)) {
    for (var i = 0; i < items.length - 1; i++) {
      for (var j = i + 1; j < items.length; j++) {
        // 如果两个 SKU 位置中间有"换成/改"，则前一个是被替换的，后一个是替换成的
        var fi = found[i], fj = found[j];
        var between = text.slice(fi.p1, fj.p0);
        if (/(换成|改|换做|改成)/.test(between)) {
          // 标记前一个为取消
          if (items[i].kind !== 'cancel') {
            items[i].kind = 'cancel';
            items[i].qty = 0;
            items[i].why = '自由输入：替换指令，' + SKU[fi.k].name + ' → ' + SKU[fj.k].name + '（原项取消）';
          }
          break;
        }
      }
    }
  }

  var fresh = pushItems(store, items);
  showReceipt('rcFree', buildReceipt(store, fresh));
  render();
}

// ═══ AI 智能解析 ═══

function buildSkuListForAI() {
  var list = [];
  Object.keys(SKU).forEach(function (k) {
    var s = SKU[k];
    var aliases = s.alias ? s.alias.split(' / ').map(function (a) { return a.trim(); }) : [];
    list.push({ key: k, name: s.name, aliases: aliases, unit: s.unit });
  });
  return list;
}

function buildStoreListForAI() {
  var list = [];
  Object.keys(STORES).forEach(function (name) {
    var s = STORES[name];
    list.push({ name: name, aliases: s.keys || [] });
  });
  return list;
}

function parseFreeAI() {
  var text = (document.getElementById('freeText').value || '').trim();
  if (!text) { showReceipt('rcFree', '请输入一句下单内容，例如：福田店明天加三箱牛奶'); return; }

  var statusEl = document.getElementById('aiStatus');
  statusEl.textContent = '🤖 AI 正在解析中...';
  statusEl.style.color = 'var(--accent)';

  var skuList = buildSkuListForAI();
  var storeList = buildStoreListForAI();

  var proxyUrl = fsProxyUrl();

  var xhr = new XMLHttpRequest();
  xhr.open('POST', proxyUrl + '/ai/parse');
  xhr.setRequestHeader('Content-Type', 'application/json');
  var aiKey = document.getElementById('fsAiKey') ? document.getElementById('fsAiKey').value.trim() : '';
  if (aiKey) xhr.setRequestHeader('X-API-Key', aiKey);
  xhr.onload = function () {
    try {
      var resp = JSON.parse(xhr.responseText);
      if (resp.ok && resp.data) {
        handleAIResult(resp.data, resp.ai_mode);
      } else {
        statusEl.textContent = '❌ 解析失败: ' + (resp.error || '未知错误');
        statusEl.style.color = 'var(--danger)';
      }
    } catch (e) {
      statusEl.textContent = '❌ 响应解析失败';
      statusEl.style.color = 'var(--danger)';
    }
  };
  xhr.onerror = function () {
    statusEl.textContent = '❌ 网络错误，请检查代理服务';
    statusEl.style.color = 'var(--danger)';
  };
  xhr.send(JSON.stringify({
    text: text,
    sku_list: skuList,
    store_list: storeList
  }));
}

function handleAIResult(data, aiMode) {
  var statusEl = document.getElementById('aiStatus');
  var modeLabel = aiMode === 'live' ? '真实豆包 AI' : '演示模式 AI';
  statusEl.textContent = '✅ 解析完成（' + modeLabel + '）';
  statusEl.style.color = 'var(--success)';

  // ===== 兼容新旧格式 =====
  // 新格式：msg_type + store_id + ops + ambiguities
  // 旧格式：store + items + uncertain
  var isNewFormat = data.msg_type !== undefined;
  var msgType = data.msg_type || 'order';
  var storeId = data.store_id || data.store || null;
  var storeName = storeId;
  var storeConf = data.store_confidence !== undefined ? data.store_confidence : 0.9;
  var ops = data.ops || data.items || [];
  var deliveryDate = data.delivery_date || null;
  var dateSource = data.date_source || 'default_next_day';
  var recurring = data.recurring || false;
  var urgent = data.urgent || false;
  var ambiguities = data.ambiguities || [];
  var overallConf = data.confidence !== undefined ? data.confidence : 0.8;
  var messageNote = data.message_note || '';

  // 门店名称映射：store_id 可能是编码（FUTIAN）也可能是中文名
  if (storeId && !STORES[storeId]) {
    // 尝试按编码找中文名
    for (var sname in STORES) {
      var keys = STORES[sname].keys || [sname.replace(/店$/, '')];
      if (keys.indexOf(storeId) >= 0) { storeName = sname; break; }
    }
  } else if (storeId && STORES[storeId]) {
    storeName = storeId;
  }

  // ===== 非订单消息处理 =====
  if (msgType !== 'order') {
    var typeMap = { notice: '通知类', query: '咨询类', irrelevant: '无关消息' };
    var typeLabel = typeMap[msgType] || msgType;
    state.meta.push({
      t: 'AI 消息分类',
      v: typeLabel + '：' + (messageNote || '未解析为订单指令'),
      store: storeName || '-',
      done: false,
      mi: state.meta.length
    });
    showReceipt('rcFree',
      '<b>【AI 识别为' + typeLabel + '】</b>' +
      (messageNote ? '<br>' + escapeExternal(messageNote) : '') +
      '<br><span class="note">该消息不含订货指令，未生成订单行。</span>');
    render();
    return;
  }

  // ===== 门店未识别 =====
  if (!storeName || storeConf < 0.5) {
    state.meta.push({
      t: '门店识别（AI）',
      v: '门店不明确，置信度 ' + Math.round(storeConf * 100) + '%，已转人工',
      store: '-',
      done: false,
      mi: state.meta.length
    });
    showReceipt('rcFree', '<b>【AI 转人工】</b>未明确识别到门店，请指明门店名称。');
    render();
    return;
  }

  // ===== 解析订单行 =====
  var items = [];
  ops.forEach(function (item) {
    // 兼容新老格式的字段名
    var skuCode = item.sku_code || item.sku_key || null;
    var skuName = item.sku_name || null;
    var raw = item.raw || '';
    var qty = item.qty;
    var unit = item.unit_raw || item.unit || '';
    var op = item.op || 'set';
    var fuzzy = item.fuzzy || null;
    var cancelScope = item.cancel_scope || null;
    var conf = item.confidence !== undefined ? item.confidence : 0.8;
    var candidates = item.candidates || [];
    var note = item.note || '';

    // SKU 匹配
    var skuKey = skuCode;
    if (!skuKey || !SKU[skuKey]) {
      // 按名称匹配
      if (skuName) {
        for (var k in SKU) {
          if (SKU[k].name === skuName) { skuKey = k; break; }
        }
      }
    }
    if (!skuKey || !SKU[skuKey]) {
      // 未知 SKU，进复核
      state.meta.push({
        t: 'SKU 识别（AI）',
        v: '未知 SKU：' + (skuName || skuCode || '未识别') +
           (candidates.length ? '，候选：' + candidates.map(function(c){return c.sku_code;}).join('、') : ''),
        store: storeName,
        done: false,
        mi: state.meta.length
      });
      return;
    }

    var kind = 'nonstd'; // AI 解析的统一标记
    var why = 'AI 解析：' + (note || ('置信度 ' + Math.round(conf * 100) + '%'));
    if (raw) why += ' · 原话：' + raw;
    if (urgent) why += ' · 加急';

    var fc = forecast(storeName, skuKey);

    // 根据 op 类型处理
    switch (op) {
      case 'cancel':
        kind = 'cancel';
        qty = 0;
        var scopeLabel = cancelScope === 'standing' ? '以后都不要' : (cancelScope === 'today' ? '仅本次' : (cancelScope === 'partial' ? '部分取消' : '范围待确认'));
        why = 'AI 解析：取消指令（' + SKU[skuKey].name + '）· ' + scopeLabel + (raw ? ' · 原话：' + raw : '');
        break;
      case 'add':
        kind = 'computed';
        qty = (fc > 0 && qty !== null && qty !== undefined) ? fc + qty : (qty || fc * 1.3);
        why = 'AI 解析：加指令，建议量 ' + fmt(fc) + ' + ' + (qty !== null && qty !== undefined ? (qty - fc) : '?') + unit + (raw ? ' · 原话：' + raw : '');
        if (qty === null || qty === undefined) { kind = 'fuzzy'; qty = fc * 1.3; }
        break;
      case 'reduce':
      case 'adjust':
        if (fuzzy === 'ratio' && qty !== null && qty !== undefined) {
          kind = 'computed';
          qty = fc > 0 ? fc * qty : 0;
          why = 'AI 解析：比例调整（×' + qty / fc + '）' + (raw ? ' · 原话：' + raw : '');
        } else if (op === 'reduce') {
          kind = 'computed';
          qty = fc > 0 && qty !== null ? Math.max(0, fc - qty) : (fc * 0.7);
          why = 'AI 解析：减指令，建议量 ' + fmt(fc) + ' − ' + qty + unit + (raw ? ' · 原话：' + raw : '');
        } else {
          // adjust 但非比例
          kind = 'fuzzy';
          if (fuzzy === 'more') qty = fc * 1.3;
          else if (fuzzy === 'less') qty = fc * 0.7;
          else qty = fc * 1.3;
          why = 'AI 解析：模糊调整（' + (fuzzy || 'unsure') + '），按建议量 ×' + (qty / fc).toFixed(1) + ' 给参考值';
        }
        break;
      case 'unknown':
        kind = 'fuzzy';
        qty = fc * 1.3;
        why = 'AI 解析：无法确定操作类型，按建议量 ×1.3 给参考值 · 原话：' + (raw || '');
        break;
      case 'set':
      default:
        kind = 'computed';
        if (qty === null || qty === undefined) {
          kind = 'fuzzy';
          if (fuzzy === 'more') {
            qty = fc * 1.3;
            why = 'AI 解析：用户说"多来点"，按建议量 ×1.3 给参考值';
          } else if (fuzzy === 'less') {
            qty = fc * 0.7;
            why = 'AI 解析：用户说"少来点"，按建议量 ×0.7 给参考值';
          } else if (fuzzy === 'ratio') {
            // 有比例系数的用比例
            var ratio = op === 'adjust' && item.ratio ? item.ratio : 1;
            qty = fc * ratio;
            why = 'AI 解析：比例调整 ×' + ratio + '（置信度 ' + Math.round(conf * 100) + '%）';
          } else {
            qty = fc * 1.3;
            why = 'AI 解析：数量未明确，按建议量 ×1.3 给参考值';
          }
          if (raw) why += ' · 原话：' + raw;
        } else {
          why = 'AI 解析：设定数量 ' + qty + unit + '（置信度 ' + Math.round(conf * 100) + '%）' + (raw ? ' · 原话：' + raw : '');
        }
        break;
    }

    // 低置信度转人工
    if (conf < 0.6 && kind !== 'fuzzy') {
      kind = 'fuzzy';
      why += ' · 低置信度（' + Math.round(conf * 100) + '%），建议人工确认';
    }
    // 候选 SKU 不确定
    if (candidates && candidates.length > 0) {
      kind = 'fuzzy';
      why += ' · SKU 候选：' + candidates.map(function(c){return c.sku_code;}).join('/');
    }

    items.push({ sku: skuKey, qty: fmt(qty), kind: kind, why: why, urgent: urgent });
  });

  // ===== 歧义项进复核队列 =====
  if (ambiguities && ambiguities.length > 0) {
    state.meta.push({
      t: 'AI 歧义提示',
      v: ambiguities.length + ' 项不确定：' + ambiguities.join('；'),
      store: storeName,
      done: false,
      mi: state.meta.length
    });
  }

  // ===== 日期信息 =====
  var dateInfo = '';
  if (deliveryDate) dateInfo = ' · 配送日期：' + deliveryDate;
  else if (dateSource === 'relative_tomorrow') dateInfo = ' · 明日配送';
  else dateInfo = ' · 默认次日配送';

  // ===== 周期性 =====
  if (recurring) {
    state.meta.push({
      t: '周期订单（AI）',
      v: 'AI 识别到周期性订单（以后每天/每周），请人工确认周期范围',
      store: storeName,
      done: false,
      mi: state.meta.length
    });
  }

  // ===== 整体置信度低转人工 =====
  if (overallConf < 0.5) {
    state.meta.push({
      t: 'AI 置信度过低',
      v: '整体置信度 ' + Math.round(overallConf * 100) + '%，建议人工复核全部内容',
      store: storeName,
      done: false,
      mi: state.meta.length
    });
  }

  var fresh = pushItems(storeName, items);
  var receiptText = buildReceipt(storeName, fresh) +
    '<div style="margin-top:8px;font-size:11.5px;color:var(--text-faint)">' +
    '置信度：' + Math.round(overallConf * 100) + '%' + dateInfo +
    (urgent ? ' · <span style="color:var(--danger)">⚡ 加急</span>' : '') +
    (recurring ? ' · <span style="color:var(--accent)">周期订单</span>' : '') +
    '</div>';
  showReceipt('rcFree', receiptText);
  render();
}

    ]);

function exportPurchaseCsv() {
  var sum = purchaseSummary();
  if (!sum.length) { alert('暂无采购汇总数据可导出'); return; }
  var rows = [['供应商','SKU','合计数量','单位','涉及门店数','说明']];
  sum.forEach(function (g) {
    g.items.forEach(function (it) {
      var s = SKU[it.sku] || { name: it.sku, unit: '' };
      rows.push([g.supplier, s.name, it.total, s.unit, it.stores.length, it.stores.join('、')]);
    });
  });
  downloadCsv(rows, '采购汇总_' + todayStr() + '.csv');
}

function downloadCsv(rows, filename) {
  // BOM + CSV，确保 Excel 打开不乱码
  var csv = '\\uFEFF' + rows.map(function (r) {
    return r.map(function (c) {
      var v = String(c == null ? '' : c);
      return /[",\\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',');
  }).join('\\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function purchaseSummary() {
  var live = state.items.filter(function (i) { return i.kind !== 'cancel' || i.qty > 0; });
  var by = {};
  live.forEach(function (i) {
    var s = SKU[i.sku];
    if (!s) return;
    var sup = s.supplier || '未分类';
    var st = statusOf(i);
    by[sup] = by[sup] || {};
    var rec = by[sup][i.sku] = by[sup][i.sku] || { total: 0, stores: [] };
    var fc = forecast(i.store, i.sku);
    var use = (st === 'red') ? fc : (i.qty || 0);
    if (use > 0) rec.total += use;
    if (rec.stores.indexOf(i.store) < 0) rec.stores.push(i.store);
  });
  var result = [];
  Object.keys(by).sort().forEach(function (sup) {
    var items = [];
    Object.keys(by[sup]).forEach(function (sku) {
      items.push({ sku: sku, total: by[sup][sku].total, stores: by[sup][sku].stores });
    });
    result.push({ supplier: sup, items: items });
  });
  return result;
}

function adjustItem(uid) {

function bumpStat(id) {

function render() {
  var live = state.items.filter(function (i) { return !i.overridden; });

  var o = document.getElementById('orders');
  o.innerHTML = state.items.length ? state.items.map(function (i) {
    var s = SKU[i.sku];
    var st = i.overridden ? 'gray' : statusOf(i);
    var lab = i.overridden ? '已覆盖' : (i.confirmed ? '已确认' : (st === 'red' ? '转人工' : (st === 'yellow' ? '待确认' : '通过')));
    return '<tr class="' + (i.overridden ? 'overridden' : '') + '"><td>' + i.store + '</td><td>' + s.name +
      (i.urgent ? ' <span class="urgent-tag">⚡加急</span>' : '') +
      '</td><td>' + i.qty + ' ' + s.unit + '</td><td>' + dot(st) + tag(st === 'gray' ? 'gray' : st, lab) +
      '</td><td class="note">' + (i.overridden ? i.note : i.why) + '</td></tr>';
  }).join('') : '<tr><td colspan="5" class="empty">暂无</td></tr>';

  var warns = 0;
  var f = document.getElementById('fc');
  var rows = live.filter(function (i) { return i.kind !== 'cancel' && i.kind !== 'nonstd'; });
  f.innerHTML = rows.length ? rows.map(function (i) {
    var s = SKU[i.sku], fc = forecast(i.store, i.sku);
    if (fc <= 0) return '';
    var d = (i.qty - fc) / fc, pct = Math.round(d * 100);
    var over = !i.confirmed && Math.abs(d) >= state.th;
    if (over) warns++;
    var tip = i.confirmed ? tag('green', '人工已确认') : (over ? (d > 0 ? tag('red', '损耗风险') : tag('red', '缺货风险')) : tag('green', '正常'));
    return '<tr><td>' + i.store + '</td><td>' + s.name + '</td><td>' + fmt(fc) + ' ' + s.unit + '</td><td>' +
      i.qty + ' ' + s.unit + '</td><td>' + (pct > 0 ? '+' : '') + pct + '%</td><td>' + tip + '</td></tr>';
  }).join('') : '<tr><td colspan="6" class="empty">暂无</td></tr>';

  var list = [];
  live.forEach(function (i) {
    var st = statusOf(i);
    if (st === 'green') return;
    var s = SKU[i.sku], fc = forecast(i.store, i.sku);
    var extra = (i.kind === 'computed' && fc > 0) ? '；偏离预测 ' + Math.round((i.qty - fc) / fc * 100) + '%' : '';
    var ops = miniBtn('confirmItem', i.uid, '确认原量');
    if (fc > 0) ops += miniBtn('adjustItem', i.uid, '按建议量 ' + fmt(fc) + s.unit + '调整');
    list.push({ v:i.store + ' · ' + s.name, a:i.why + extra, st:st, ops:ops });
  });
  state.meta.forEach(function (m) {
    if (!m.done) list.push({ v:(m.store === '-' ? '' : m.store + ' · ') + m.t, a:m.v, st:'yellow', ops:miniBtn('resolveMeta', m.mi, '已处理') });
  });
  document.getElementById('exc').innerHTML = list.length
    ? list.map(function (x) { return '<tr><td>' + dot(x.st) + x.v + '</td><td class="note">' + x.a + '<br>' + x.ops + '</td></tr>'; }).join('')
    : '<tr><td colspan="2" class="empty">暂无</td></tr>';

  var by = {}, pend = {};
  live.forEach(function (i) {
    var s = SKU[i.sku], sup = s.supplier, st = statusOf(i);
    by[sup] = by[sup] || {};
    pend[sup] = pend[sup] || 0;
    var rec = by[sup][i.sku] = by[sup][i.sku] || { qty:0, flag:'' };
    if (i.qty === 0) { pend[sup]++; rec.flag = rec.flag || '整项取消 · 未计入'; return; }
    var fc = forecast(i.store, i.sku);
    var use = (st === 'red') ? fc : i.qty;
    if (use > 0) {
      rec.qty += use;
      if (st === 'red') { rec.flag = '待确认 · 暂按预测 ' + fmt(fc) + s.unit; pend[sup]++; }
      else if (st === 'yellow') { rec.flag = rec.flag || '待确认'; pend[sup]++; }
    } else {
      rec.flag = rec.flag || '非标品 · 未计入'; pend[sup]++;
    }
  });
  var keys = Object.keys(by), html = '';
  keys.forEach(function (sup) {
    html += '<tr class="grp"><td>' + sup + '</td><td></td><td class="note">' +
      (pend[sup] ? tag('yellow', '含 ' + pend[sup] + ' 项待确认') : '') + '</td></tr>';
    Object.keys(by[sup]).forEach(function (k) {
      var r = by[sup][k];
      html += '<tr><td style="padding-left:18px">' + SKU[k].name + '</td><td>' + fmt(r.qty) + ' ' + SKU[k].unit +
        '</td><td class="note">' + r.flag + '</td></tr>';
    });
  });
  document.getElementById('sum').innerHTML = keys.length ? html : '<tr><td colspan="3" class="empty">暂无</td></tr>';

  // 统计数字 + 跳动动画
  var vals = { s1: live.length, s2: list.length, s3: warns, s4: live.length * 2 };
  Object.keys(vals).forEach(function (k, idx) {
    var el = document.getElementById(k);
    var newVal = vals[k];
    if (prevStats[k] !== newVal && prevStats[k] !== -1) {
      bumpStat(idx + 1);
    }
    el.textContent = newVal;
    prevStats[k] = newVal;
  });
  if (prevStats.s1 === -1) {
    prevStats = { s1: vals.s1, s2: vals.s2, s3: vals.s3, s4: vals.s4 };
  }
  // 自动保存草稿
  saveDraft();
}

var _kbOpen = { all: true };
function renderKb() {
  var stats = document.getElementById('kbStats');
  var acc = document.getElementById('kbAccordion');
  var total = Object.keys(SKU).length;

  // 搜索关键词
  var kw = '';
  var kwEl = document.getElementById('kbSearch');
  if (kwEl) kw = kwEl.value.trim().toLowerCase();

  // 统计
  var shownCount = 0;
  if (kw) {
    Object.keys(SKU).forEach(function (k) {
      var s = SKU[k];
      var haystack = (s.name + ' ' + s.alias + ' ' + s.supplier + ' ' + k).toLowerCase();
      if (haystack.indexOf(kw) >= 0) shownCount++;
    });
    stats.innerHTML = '<span class="kb-stat">搜索 "<b>' + escapeHtml(kw) + '</b>" 找到 <b>' + shownCount + '</b> / 共 ' + total + ' 个 SKU</span>';
  } else {
    stats.innerHTML = '<span class="kb-stat">共 <b>' + total + '</b> 个 SKU · 分 <b>' + (SKU_CATEGORIES.length - 1) + '</b> 大品类 · 点击分类展开查看</span>';
  }

  // 手风琴：每个分类一个折叠块
  var cats = SKU_CATEGORIES.filter(function (c) { return c.key !== 'all'; });
  var html = '';
  cats.forEach(function (c) {
    var keys = Object.keys(SKU).filter(function (k) {
      if (SKU[k].cat !== c.key) return false;
      if (!kw) return true;
      var s = SKU[k];
      var haystack = (s.name + ' ' + s.alias + ' ' + s.supplier + ' ' + k).toLowerCase();
      return haystack.indexOf(kw) >= 0;
    });
    var count = keys.length;
    // 搜索模式下，空分类不显示
    if (kw && count === 0) return;

    var isOpen = _kbOpen[c.key] || (kw && count > 0); // 搜索时自动展开有结果的分类
    var rows = keys.map(function (k) {
      var s = SKU[k];
      var nameHtml = kw && s.name.toLowerCase().indexOf(kw) >= 0
        ? highlightText(s.name, kw)
        : s.name;
      var aliasHtml = kw && s.alias.toLowerCase().indexOf(kw) >= 0
        ? highlightText(s.alias, kw)
        : s.alias;
      return '<tr><td>' + nameHtml + '</td><td class="note">' + aliasHtml + '</td><td>' + s.unit +
        '</td><td>' + s.supplier + '</td><td>' + s.pp + ' ' + s.unit + '/人</td></tr>';
    }).join('');

    html += '<details class="kb-item" ' + (isOpen ? 'open' : '') + ' data-cat="' + c.key + '" ontoggle="handleKbToggle(this)">' +
      '<summary>' +
        '<span class="kb-item-icon">' + c.icon + '</span>' +
        '<span class="kb-item-name">' + c.name + '</span>' +
        '<span class="kb-item-count">' + count + ' 项</span>' +
      '</summary>' +
      '<div class="kb-item-body">' +
        '<table>' +
          '<thead><tr><th>SKU</th><th>常见口语别名</th><th>单位</th><th>供应商</th><th>单客消耗系数</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>' +
    '</details>';
  });

  if (kw && shownCount === 0) {
    html = '<div style="text-align:center;padding:30px 0;color:var(--text-faint);font-size:13px">没有找到匹配的 SKU</div>';
  }

  acc.innerHTML = html;
}
function handleKbToggle(el) {
  var cat = el.getAttribute('data-cat');
  _kbOpen[cat] = el.open;
}

function escapeHtml(s) {
  var div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function highlightText(text, kw) {
  if (!kw) return text;
  var lower = text.toLowerCase();
  var idx = lower.indexOf(kw.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0, idx) + '<mark style="background:var(--gold-50);color:var(--gold);padding:0 2px;border-radius:2px;font-weight:600">' + text.slice(idx, idx + kw.length) + '</mark>' + text.slice(idx + kw.length);
}

/* ───  从飞书加载  ─── */
async function syncFromFeishu(type) {
  var tableId = FS_TABLES[type];
  var tableName = FS_TABLE_NAMES[type];
  fsLog('正在从飞书加载 ' + tableName + '...', 'info');

  try {
    var data = await fsApi('GET', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records');
    var records = data.records || [];
    fsLog('获取到 ' + records.length + ' 条记录', 'ok');

    if (type === 'sku') {
      var updated = 0, added = 0;
      records.forEach(function (r) {
        var f = r.fields;
        var name = f['SKU名称'] || '';
        var alias = f['常见别名'] || '';
        var unit = (f['单位'] && f['单位'][0]) || '份';
        var supplier = f['供应商'] || '';
        var pp = f['单客消耗系数'] || 0;

        // 按名称或别名查找现有 SKU
        var foundKey = null;
        for (var k in SKU) {
          var s = SKU[k];
          if (s.name === name) { foundKey = k; break; }
          if (s.alias && alias && s.alias.indexOf(name) >= 0) { foundKey = k; break; }
        }

        if (foundKey) {
          // 更新现有 SKU
          SKU[foundKey].name = name;
          SKU[foundKey].alias = alias;
          SKU[foundKey].unit = unit;
          SKU[foundKey].supplier = supplier;
          SKU[foundKey].pp = pp;
          if (!SKU[foundKey].cat) SKU[foundKey].cat = guessSkuCat(name, supplier);
          updated++;
        } else {
          // 新增 SKU，用名称生成 key
          var newKey = name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
          if (!newKey) newKey = 'SKU' + (Object.keys(SKU).length + 1);
          var idx = 1, origKey = newKey;
          while (SKU[newKey]) { newKey = origKey + '_' + (++idx); }
          SKU[newKey] = { name: name, alias: alias, unit: unit, supplier: supplier, pp: pp, cat: guessSkuCat(name, supplier) };
          added++;
        }
      });
      fsLog('SKU 主数据同步完成：更新 ' + updated + ' 项，新增 ' + added + ' 项，共 ' + Object.keys(SKU).length + ' 项', 'ok');
      render();
      if (typeof renderKb === 'function') renderKb();
    } else if (type === 'store') {
      var updated = 0, added = 0;
      records.forEach(function (r) {
        var f = r.fields;
        var name = f['门店名称'];
        if (!name) return;
        var occ = f['在住人数'] || 0;
        var rate = f['早餐渗透率'] || 0;
        var extra = f['额外团队客'] || 0;
        var contact = f['联系人'] || '';

        // 生成识别关键词：店名简称 + 联系人
        var keys = [name.replace(/店$/, '')];
        if (contact) {
          // 联系人可能是"李经理"、"王总"等，直接作为识别词
          contact.split(/[，,、\\/\\s]+/).forEach(function (c) {
            c = c.trim();
            if (c && keys.indexOf(c) < 0) keys.push(c);
          });
        }

        if (STORES[name]) {
          // 更新现有门店
          STORES[name].occ = occ;
          STORES[name].rate = rate;
          STORES[name].extra = extra;
          STORES[name].keys = keys;
          updated++;
        } else {
          // 新增门店
          STORES[name] = {
            occ: occ,
            rate: rate,
            extra: extra,
            keys: keys
          };
          added++;
        }
      });
      var storeCount = Object.keys(STORES).length;
      fsLog('门店信息同步完成：更新 ' + updated + ' 家，新增 ' + added + ' 家，共 ' + storeCount + ' 家', 'ok');
      var el = document.getElementById('fsStoreCount');
      if (el) el.textContent = storeCount + ' 家门店 · 人数 / 渗透率 / 团队客';
      render();
    } else if (type === 'order') {
      var count = 0;
      // 清空现有订单
      state.items = [];
      state.meta = [];
      state.done = {};
      state.seq = 0;
      records.forEach(function (r) {
        var f = r.fields;
        var store = f['门店'] || '';
        var skuName = f['SKU'] || '';
        var qty = f['数量'] || 0;
        var statusField = (f['状态'] && f['状态'][0]) || '';
        var why = f['解析依据'] || '';
        var source = f['来源消息'] || '';
        var parseType = (f['解析方式'] && f['解析方式'][0]) || '';
        var overridden = f['是否覆盖'] || false;
        var confirmed = f['人工确认'] || false;

        // 反查 SKU key
        var skuKey = null;
        for (var k in SKU) {
          if (SKU[k].name === skuName) { skuKey = k; break; }
        }
        if (!skuKey) {
          // 找不到就用名称转码生成
          skuKey = skuName.replace(/[^a-zA-Z0-9]/g, '').toUpperCase() || 'UNKNOWN';
          if (!SKU[skuKey]) {
            SKU[skuKey] = { name: skuName, alias: '', unit: (f['单位'] && f['单位'][0]) || '份', supplier: '', pp: 0, cat: guessSkuCat(skuName, '') };
          }
        }

        // 判断 kind
        var kind = 'computed';
        if (statusField === '转人工') {
          if (why && why.indexOf('取消') >= 0) kind = 'cancel';
          else if (parseType === '大模型解析') kind = 'nonstd';
          else kind = 'fuzzy';
        } else if (statusField === '待确认') {
          kind = 'fuzzy';
        }
        if (parseType === '大模型解析' && kind === 'computed') kind = 'nonstd';

        state.items.push({
          store: store,
          sku: skuKey,
          qty: qty,
          kind: kind,
          why: why,
          overridden: overridden,
          note: '',
          confirmed: confirmed,
          source: source,
          uid: ++state.seq
        });
        count++;
      });
      fsLog('订单明细加载完成：' + count + ' 条', 'ok');
      document.getElementById('fsOrderCount').textContent = count + ' 条订单 · 已从飞书加载';
      render();
    }
  } catch (e) {
    fsLog('加载失败：' + e.message, 'err');
    fsSetStatus('err', '连接失败');
  }
}

/* ───  同步到飞书  ─── */
async function syncToFeishu(type) {
  var tableId = FS_TABLES[type];
  var tableName = FS_TABLE_NAMES[type];
  fsLog('正在同步 ' + tableName + ' 到飞书...', 'info');

  try {
    // 先清空旧数据（删除所有记录）
    var existing = await fsApi('GET', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records');
    var existingRecords = existing.records || [];
    if (existingRecords.length > 0) {
      var ids = existingRecords.map(function (r) { return r.record_id; });
      await fsApi('DELETE', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records', { record_ids: ids });
      fsLog('已清空旧数据 ' + existingRecords.length + ' 条', 'warn');
    }

    // 准备新数据
    var records = [];
    if (type === 'order') {
      state.items.forEach(function (item) {
        var s = SKU[item.sku] || { name: item.sku, unit: '', supplier: '' };
        var st = statusOf(item);
        var statusMap = { green: '通过', yellow: '待确认', red: '转人工' };
        records.push({
          fields: {
            '订单日期': new Date().toISOString().split('T')[0],
            '门店': item.store,
            'SKU': s.name || item.sku,
            '数量': item.qty,
            '单位': s.unit || '',
            '状态': [statusMap[st] || '待确认'],
            '解析依据': item.why || '',
            '来源消息': item.source || '手动解析',
            '解析方式': [item.kind === 'nonstd' ? '大模型解析' : '规则解析'],
            '是否覆盖': item.overridden || false,
            '人工确认': item.confirmed || false
          }
        });
      });
    } else if (type === 'review') {
      // 生成复核队列（红色和黄色项）
      state.items.forEach(function (item) {
        var st = statusOf(item);
        if (st === 'green' && item.kind !== 'cancel' && item.kind !== 'nonstd') return;
        var s = SKU[item.sku] || { name: item.sku };
        var typeMap = { cancel: '取消指令', fuzzy: '数量偏离', nonstd: '非标品', history: '数量偏离', computed: '数量偏离' };
        var sevMap = { cancel: '高', nonstd: '高', fuzzy: '中', history: '中' };
        records.push({
          fields: {
            '异常项': s.name + '（' + (item.kind === 'cancel' ? '取消' : item.kind === 'nonstd' ? '非标' : '待确认') + '）',
            '门店': item.store,
            'SKU': s.name || item.sku,
            '异常类型': [typeMap[item.kind] || '数量偏离'],
            '严重程度': [sevMap[item.kind] || '中'],
            '处理建议': item.why || '请人工复核确认',
            '状态': ['待处理']
          }
        });
      });
    } else if (type === 'purchase') {
      // 按供应商汇总
      var summary = {};
      state.items.forEach(function (item) {
        if (item.overridden) return;
        var s = SKU[item.sku];
        if (!s) return;
        var key = s.supplier + '|' + s.name;
        if (!summary[key]) {
          summary[key] = { supplier: s.supplier, sku: s.name, unit: s.unit, qty: 0 };
        }
        summary[key].qty += item.qty || 0;
      });
      Object.values(summary).forEach(function (item) {
        records.push({
          fields: {
            '日期': new Date().toISOString().split('T')[0],
            '供应商': item.supplier,
            'SKU': item.sku,
            '合计数量': Math.round(item.qty * 100) / 100,
            '单位': item.unit,
            '状态': ['待确认'],
            '说明': ''
          }
        });
      });
    }

    if (records.length === 0) {
      fsLog('没有需要同步的数据', 'warn');
      return;
    }

    // 分批写入（每批 100 条）
    var batchSize = 100;
    for (var i = 0; i < records.length; i += batchSize) {
      var batch = records.slice(i, i + batchSize);
      await fsApi('POST', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records', { records: batch });
    }

    fsLog(tableName + ' 同步完成：' + records.length + ' 条', 'ok');
    if (type === 'order') {
      document.getElementById('fsOrderCount').textContent = state.items.length + ' 条订单 · 已同步至飞书';
    } else if (type === 'review') {
      var el = document.getElementById('fsReviewCount');
      if (el) el.textContent = records.length + ' 条异常 · 已同步至飞书';
    } else if (type === 'purchase') {
      var el2 = document.getElementById('fsPurchaseCount');
      if (el2) el2.textContent = records.length + ' 条汇总 · 已同步至飞书';
    }
  } catch (e) {
    fsLog('同步失败：' + e.message, 'err');
    fsSetStatus('err', '连接失败');
  }
}

async function syncAllToFeishu() {
  fsLog('═══  开始全量同步  ═══', 'info');
  await syncToFeishu('order');
  await syncToFeishu('review');
  await syncToFeishu('purchase');
  fsLog('═══  全量同步完成  ═══', 'ok');
}
