function render() {
  var live = state.items.filter(function (i) { return !i.overridden; });

  var o = document.getElementById('orders');
  o.innerHTML = state.items.length ? state.items.map(function (i) {
    var s = SKU[i.sku];
    var st = i.overridden ? 'gray' : statusOf(i);
    var lab = i.overridden ? '已覆盖' : (i.confirmed ? '已确认' : (st === 'red' ? '转人工' : (st === 'yellow' ? '待确认' : '通过')));
    return '<tr class="' + (i.overridden ? 'overridden' : '') + '"><td>' + i.store + '</td><td>' + s.name +
      (i.urgent ? ' <span class="urgent-tag">⚡加急</span>' : '') +
      '</td><td>' + i.qty + ' ' + s.unit + '</td><td>' + dot(st) + tag(st === 'gray' ? 'gray' : st, lab) +
      '</td><td class="note">' + (i.overridden ? i.note : i.why) + '</td></tr>';
  }).join('') : '<tr><td colspan="5" class="empty">暂无</td></tr>';

  var warns = 0;
  var f = document.getElementById('fc');
  var rows = live.filter(function (i) { return i.kind !== 'cancel' && i.kind !== 'nonstd'; });
  f.innerHTML = rows.length ? rows.map(function (i) {
    var s = SKU[i.sku], fc = forecast(i.store, i.sku);
    if (fc <= 0) return '';
    var d = (i.qty - fc) / fc, pct = Math.round(d * 100);
    var over = !i.confirmed && Math.abs(d) >= state.th;
    if (over) warns++;
    var tip = i.confirmed ? tag('green', '人工已确认') : (over ? (d > 0 ? tag('red', '损耗风险') : tag('red', '缺货风险')) : tag('green', '正常'));
    return '<tr><td>' + i.store + '</td><td>' + s.name + '</td><td>' + fmt(fc) + ' ' + s.unit + '</td><td>' +
      i.qty + ' ' + s.unit + '</td><td>' + (pct > 0 ? '+' : '') + pct + '%</td><td>' + tip + '</td></tr>';
  }).join('') : '<tr><td colspan="6" class="empty">暂无</td></tr>';

  var list = [];
  live.forEach(function (i) {
    var st = statusOf(i);
    if (st === 'green') return;
    var s = SKU[i.sku], fc = forecast(i.store, i.sku);
    var extra = (i.kind === 'computed' && fc > 0) ? '；偏离预测 ' + Math.round((i.qty - fc) / fc * 100) + '%' : '';
    var ops = miniBtn('confirmItem', i.uid, '确认原量');
    if (fc > 0) ops += miniBtn('adjustItem', i.uid, '按建议量 ' + fmt(fc) + s.unit + '调整');
    list.push({ v:i.store + ' · ' + s.name, a:i.why + extra, st:st, ops:ops });
  });
  state.meta.forEach(function (m) {
    if (!m.done) list.push({ v:(m.store === '-' ? '' : m.store + ' · ') + m.t, a:m.v, st:'yellow', ops:miniBtn('resolveMeta', m.mi, '已处理') });
  });
  document.getElementById('exc').innerHTML = list.length
    ? list.map(function (x) { return '<tr><td>' + dot(x.st) + x.v + '</td><td class="note">' + x.a + '<br>' + x.ops + '</td></tr>'; }).join('')
    : '<tr><td colspan="2" class="empty">暂无</td></tr>';

  var by = {}, pend = {};
  live.forEach(function (i) {
    var s = SKU[i.sku], sup = s.supplier, st = statusOf(i);
    by[sup] = by[sup] || {};
    pend[sup] = pend[sup] || 0;
    var rec = by[sup][i.sku] = by[sup][i.sku] || { qty:0, flag:'' };
    if (i.qty === 0) { pend[sup]++; rec.flag = rec.flag || '整项取消 · 未计入'; return; }
    var fc = forecast(i.store, i.sku);
    var use = (st === 'red') ? fc : i.qty;
    if (use > 0) {
      rec.qty += use;
      if (st === 'red') { rec.flag = '待确认 · 暂按预测 ' + fmt(fc) + s.unit; pend[sup]++; }
      else if (st === 'yellow') { rec.flag = rec.flag || '待确认'; pend[sup]++; }
    } else {
      rec.flag = rec.flag || '非标品 · 未计入'; pend[sup]++;
    }
  });
  var keys = Object.keys(by), html = '';
  keys.forEach(function (sup) {
    html += '<tr class="grp"><td>' + sup + '</td><td></td><td class="note">' +
      (pend[sup] ? tag('yellow', '含 ' + pend[sup] + ' 项待确认') : '') + '</td></tr>';
    Object.keys(by[sup]).forEach(function (k) {
      var r = by[sup][k];
      html += '<tr><td style="padding-left:18px">' + SKU[k].name + '</td><td>' + fmt(r.qty) + ' ' + SKU[k].unit +
        '</td><td class="note">' + r.flag + '</td></tr>';
    });
  });
  document.getElementById('sum').innerHTML = keys.length ? html : '<tr><td colspan="3" class="empty">暂无</td></tr>';

  // 统计数字 + 跳动动画
  var vals = { s1: live.length, s2: list.length, s3: warns, s4: live.length * 2 };
  Object.keys(vals).forEach(function (k, idx) {
    var el = document.getElementById(k);
    var newVal = vals[k];
    if (prevStats[k] !== newVal && prevStats[k] !== -1) {
      bumpStat(idx + 1);
    }
    el.textContent = newVal;
    prevStats[k] = newVal;
  });
  if (prevStats.s1 === -1) {
    prevStats = { s1: vals.s1, s2: vals.s2, s3: vals.s3, s4: vals.s4 };
  }
  // 自动保存草稿
  saveDraft();
}

var _kbOpen = { all: true };
function renderKb() {
  var stats = document.getElementById('kbStats');
  var acc = document.getElementById('kbAccordion');
  var total = Object.keys(SKU).length;

  // 搜索关键词
  var kw = '';
  var kwEl = document.getElementById('kbSearch');
  if (kwEl) kw = kwEl.value.trim().toLowerCase();

  // 统计
  var shownCount = 0;
  if (kw) {
    Object.keys(SKU).forEach(function (k) {
      var s = SKU[k];
      var haystack = (s.name + ' ' + s.alias + ' ' + s.supplier + ' ' + k).toLowerCase();
      if (haystack.indexOf(kw) >= 0) shownCount++;
    });
    stats.innerHTML = '<span class="kb-stat">搜索 "<b>' + escapeHtml(kw) + '</b>" 找到 <b>' + shownCount + '</b> / 共 ' + total + ' 个 SKU</span>';
  } else {
    stats.innerHTML = '<span class="kb-stat">共 <b>' + total + '</b> 个 SKU · 分 <b>' + (SKU_CATEGORIES.length - 1) + '</b> 大品类 · 点击分类展开查看</span>';
  }

  // 手风琴：每个分类一个折叠块
  var cats = SKU_CATEGORIES.filter(function (c) { return c.key !== 'all'; });
  var html = '';
  cats.forEach(function (c) {
    var keys = Object.keys(SKU).filter(function (k) {
      if (SKU[k].cat !== c.key) return false;
      if (!kw) return true;
      var s = SKU[k];
      var haystack = (s.name + ' ' + s.alias + ' ' + s.supplier + ' ' + k).toLowerCase();
      return haystack.indexOf(kw) >= 0;
    });
    var count = keys.length;
    // 搜索模式下，空分类不显示
    if (kw && count === 0) return;

    var isOpen = _kbOpen[c.key] || (kw && count > 0); // 搜索时自动展开有结果的分类
    var rows = keys.map(function (k) {
      var s = SKU[k];
      var nameHtml = kw && s.name.toLowerCase().indexOf(kw) >= 0
        ? highlightText(s.name, kw)
        : s.name;
      var aliasHtml = kw && s.alias.toLowerCase().indexOf(kw) >= 0
        ? highlightText(s.alias, kw)
        : s.alias;
      return '<tr><td>' + nameHtml + '</td><td class="note">' + aliasHtml + '</td><td>' + s.unit +
        '</td><td>' + s.supplier + '</td><td>' + s.pp + ' ' + s.unit + '/人</td></tr>';
    }).join('');

    html += '<details class="kb-item" ' + (isOpen ? 'open' : '') + ' data-cat="' + c.key + '" ontoggle="handleKbToggle(this)">' +
      '<summary>' +
        '<span class="kb-item-icon">' + c.icon + '</span>' +
        '<span class="kb-item-name">' + c.name + '</span>' +
        '<span class="kb-item-count">' + count + ' 项</span>' +
      '</summary>' +
      '<div class="kb-item-body">' +
        '<table>' +
          '<thead><tr><th>SKU</th><th>常见口语别名</th><th>单位</th><th>供应商</th><th>单客消耗系数</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>' +
    '</details>';
  });

  if (kw && shownCount === 0) {
    html = '<div style="text-align:center;padding:30px 0;color:var(--text-faint);font-size:13px">没有找到匹配的 SKU</div>';
  }

  acc.innerHTML = html;
}
function handleKbToggle(el) {
  var cat = el.getAttribute('data-cat');
  _kbOpen[cat] = el.open;
}

function escapeHtml(s) {
  var div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function highlightText(text, kw) {
  if (!kw) return text;
  var lower = text.toLowerCase();
  var idx = lower.indexOf(kw.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0, idx) + '<mark style="background:var(--gold-50);color:var(--gold);padding:0 2px;border-radius:2px;font-weight:600">' + text.slice(idx, idx + kw.length) + '</mark>' + text.slice(idx + kw.length);
}

/* ───  从飞书加载  ─── */
async function syncFromFeishu(type) {
  var tableId = FS_TABLES[type];
  var tableName = FS_TABLE_NAMES[type];
  fsLog('正在从飞书加载 ' + tableName + '...', 'info');

  try {
    var data = await fsApi('GET', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records');
    var records = data.records || [];
    fsLog('获取到 ' + records.length + ' 条记录', 'ok');

    if (type === 'sku') {
      var updated = 0, added = 0;
      records.forEach(function (r) {
        var f = r.fields;
        var name = f['SKU名称'] || '';
        var alias = f['常见别名'] || '';
        var unit = (f['单位'] && f['单位'][0]) || '份';
        var supplier = f['供应商'] || '';
        var pp = f['单客消耗系数'] || 0;

        // 按名称或别名查找现有 SKU
        var foundKey = null;
        for (var k in SKU) {
          var s = SKU[k];
          if (s.name === name) { foundKey = k; break; }
          if (s.alias && alias && s.alias.indexOf(name) >= 0) { foundKey = k; break; }
        }

        if (foundKey) {
          // 更新现有 SKU
          SKU[foundKey].name = name;
          SKU[foundKey].alias = alias;
          SKU[foundKey].unit = unit;
          SKU[foundKey].supplier = supplier;
          SKU[foundKey].pp = pp;
          if (!SKU[foundKey].cat) SKU[foundKey].cat = guessSkuCat(name, supplier);
          updated++;
        } else {
          // 新增 SKU，用名称生成 key
          var newKey = name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
          if (!newKey) newKey = 'SKU' + (Object.keys(SKU).length + 1);
          var idx = 1, origKey = newKey;
          while (SKU[newKey]) { newKey = origKey + '_' + (++idx); }
          SKU[newKey] = { name: name, alias: alias, unit: unit, supplier: supplier, pp: pp, cat: guessSkuCat(name, supplier) };
          added++;
        }
      });
      fsLog('SKU 主数据同步完成：更新 ' + updated + ' 项，新增 ' + added + ' 项，共 ' + Object.keys(SKU).length + ' 项', 'ok');
      render();
      if (typeof renderKb === 'function') renderKb();
    } else if (type === 'store') {
      var updated = 0, added = 0;
      records.forEach(function (r) {
        var f = r.fields;
        var name = f['门店名称'];
        if (!name) return;
        var occ = f['在住人数'] || 0;
        var rate = f['早餐渗透率'] || 0;
        var extra = f['额外团队客'] || 0;
        var contact = f['联系人'] || '';

        // 生成识别关键词：店名简称 + 联系人
        var keys = [name.replace(/店$/, '')];
        if (contact) {
          // 联系人可能是"李经理"、"王总"等，直接作为识别词
          contact.split(/[，,、\\/\\s]+/).forEach(function (c) {
            c = c.trim();
            if (c && keys.indexOf(c) < 0) keys.push(c);
          });
        }

        if (STORES[name]) {
          // 更新现有门店
          STORES[name].occ = occ;
          STORES[name].rate = rate;
          STORES[name].extra = extra;
          STORES[name].keys = keys;
          updated++;
        } else {
          // 新增门店
          STORES[name] = {
            occ: occ,
            rate: rate,
            extra: extra,
            keys: keys
          };
          added++;
        }
      });
      var storeCount = Object.keys(STORES).length;
      fsLog('门店信息同步完成：更新 ' + updated + ' 家，新增 ' + added + ' 家，共 ' + storeCount + ' 家', 'ok');
      var el = document.getElementById('fsStoreCount');
      if (el) el.textContent = storeCount + ' 家门店 · 人数 / 渗透率 / 团队客';
      render();
    } else if (type === 'order') {
      var count = 0;
      // 清空现有订单
      state.items = [];
      state.meta = [];
      state.done = {};
      state.seq = 0;
      records.forEach(function (r) {
        var f = r.fields;
        var store = f['门店'] || '';
        var skuName = f['SKU'] || '';
        var qty = f['数量'] || 0;
        var statusField = (f['状态'] && f['状态'][0]) || '';
        var why = f['解析依据'] || '';
        var source = f['来源消息'] || '';
        var parseType = (f['解析方式'] && f['解析方式'][0]) || '';
        var overridden = f['是否覆盖'] || false;
        var confirmed = f['人工确认'] || false;

        // 反查 SKU key
        var skuKey = null;
        for (var k in SKU) {
          if (SKU[k].name === skuName) { skuKey = k; break; }
        }
        if (!skuKey) {
          // 找不到就用名称转码生成
          skuKey = skuName.replace(/[^a-zA-Z0-9]/g, '').toUpperCase() || 'UNKNOWN';
          if (!SKU[skuKey]) {
            SKU[skuKey] = { name: skuName, alias: '', unit: (f['单位'] && f['单位'][0]) || '份', supplier: '', pp: 0, cat: guessSkuCat(skuName, '') };
          }
        }

        // 判断 kind
        var kind = 'computed';
        if (statusField === '转人工') {
          if (why && why.indexOf('取消') >= 0) kind = 'cancel';
          else if (parseType === '大模型解析') kind = 'nonstd';
          else kind = 'fuzzy';
        } else if (statusField === '待确认') {
          kind = 'fuzzy';
        }
        if (parseType === '大模型解析' && kind === 'computed') kind = 'nonstd';

        state.items.push({
          store: store,
          sku: skuKey,
          qty: qty,
          kind: kind,
          why: why,
          overridden: overridden,
          note: '',
          confirmed: confirmed,
          source: source,
          uid: ++state.seq
        });
        count++;
      });
      fsLog('订单明细加载完成：' + count + ' 条', 'ok');
      document.getElementById('fsOrderCount').textContent = count + ' 条订单 · 已从飞书加载';
      render();
    }
  } catch (e) {
    fsLog('加载失败：' + e.message, 'err');
    fsSetStatus('err', '连接失败');
  }
}

/* ───  同步到飞书  ─── */
async function syncToFeishu(type) {
  var tableId = FS_TABLES[type];
  var tableName = FS_TABLE_NAMES[type];
  fsLog('正在同步 ' + tableName + ' 到飞书...', 'info');

  try {
    // 先清空旧数据（删除所有记录）
    var existing = await fsApi('GET', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records');
    var existingRecords = existing.records || [];
    if (existingRecords.length > 0) {
      var ids = existingRecords.map(function (r) { return r.record_id; });
      await fsApi('DELETE', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records', { record_ids: ids });
      fsLog('已清空旧数据 ' + existingRecords.length + ' 条', 'warn');
    }

    // 准备新数据
    var records = [];
    if (type === 'order') {
      state.items.forEach(function (item) {
        var s = SKU[item.sku] || { name: item.sku, unit: '', supplier: '' };
        var st = statusOf(item);
        var statusMap = { green: '通过', yellow: '待确认', red: '转人工' };
        records.push({
          fields: {
            '订单日期': new Date().toISOString().split('T')[0],
            '门店': item.store,
            'SKU': s.name || item.sku,
            '数量': item.qty,
            '单位': s.unit || '',
            '状态': [statusMap[st] || '待确认'],
            '解析依据': item.why || '',
            '来源消息': item.source || '手动解析',
            '解析方式': [item.kind === 'nonstd' ? '大模型解析' : '规则解析'],
            '是否覆盖': item.overridden || false,
            '人工确认': item.confirmed || false
          }
        });
      });
    } else if (type === 'review') {
      // 生成复核队列（红色和黄色项）
      state.items.forEach(function (item) {
        var st = statusOf(item);
        if (st === 'green' && item.kind !== 'cancel' && item.kind !== 'nonstd') return;
        var s = SKU[item.sku] || { name: item.sku };
        var typeMap = { cancel: '取消指令', fuzzy: '数量偏离', nonstd: '非标品', history: '数量偏离', computed: '数量偏离' };
        var sevMap = { cancel: '高', nonstd: '高', fuzzy: '中', history: '中' };
        records.push({
          fields: {
            '异常项': s.name + '（' + (item.kind === 'cancel' ? '取消' : item.kind === 'nonstd' ? '非标' : '待确认') + '）',
            '门店': item.store,
            'SKU': s.name || item.sku,
            '异常类型': [typeMap[item.kind] || '数量偏离'],
            '严重程度': [sevMap[item.kind] || '中'],
            '处理建议': item.why || '请人工复核确认',
            '状态': ['待处理']
          }
        });
      });
    } else if (type === 'purchase') {
      // 按供应商汇总
      var summary = {};
      state.items.forEach(function (item) {
        if (item.overridden) return;
        var s = SKU[item.sku];
        if (!s) return;
        var key = s.supplier + '|' + s.name;
        if (!summary[key]) {
          summary[key] = { supplier: s.supplier, sku: s.name, unit: s.unit, qty: 0 };
        }
        summary[key].qty += item.qty || 0;
      });
      Object.values(summary).forEach(function (item) {
        records.push({
          fields: {
            '日期': new Date().toISOString().split('T')[0],
            '供应商': item.supplier,
            'SKU': item.sku,
            '合计数量': Math.round(item.qty * 100) / 100,
            '单位': item.unit,
            '状态': ['待确认'],
            '说明': ''
          }
        });
      });
    }

    if (records.length === 0) {
      fsLog('没有需要同步的数据', 'warn');
      return;
    }

    // 分批写入（每批 100 条）
    var batchSize = 100;
    for (var i = 0; i < records.length; i += batchSize) {
      var batch = records.slice(i, i + batchSize);
      await fsApi('POST', '/base/' + FS_BASE_TOKEN + '/tables/' + tableId + '/records', { records: batch });
    }

    fsLog(tableName + ' 同步完成：' + records.length + ' 条', 'ok');
    if (type === 'order') {
      document.getElementById('fsOrderCount').textContent = state.items.length + ' 条订单 · 已同步至飞书';
    } else if (type === 'review') {
      var el = document.getElementById('fsReviewCount');
      if (el) el.textContent = records.length + ' 条异常 · 已同步至飞书';
    } else if (type === 'purchase') {
      var el2 = document.getElementById('fsPurchaseCount');
      if (el2) el2.textContent = records.length + ' 条汇总 · 已同步至飞书';
    }
  } catch (e) {
    fsLog('同步失败：' + e.message, 'err');
    fsSetStatus('err', '连接失败');
  }
}

async function syncAllToFeishu() {
  fsLog('═══  开始全量同步  ═══', 'info');
  await syncToFeishu('order');
  await syncToFeishu('review');
  await syncToFeishu('purchase');
  fsLog('═══  全量同步完成  ═══', 'ok');
}
