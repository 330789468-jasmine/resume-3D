<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>解郁 · 职业大楼 · 3D 交互简历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='6' width='12' height='9' rx='1' fill='%23F4A982'/%3E%3Crect x='4' y='1' width='8' height='4' rx='1' fill='%23A79AE0'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #33322E;
    --ink-2: #6B675F;
    --paper: rgba(255, 254, 250, 0.94);
    --line: rgba(51, 50, 46, 0.14);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    background: linear-gradient(#BFE0FF 0%, #EAF3E4 55%, #FDF6EC 100%);
  }
  #app { position: fixed; inset: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* 左上角模拟案例标识 */
  .mock-corner {
    position: absolute; top: 14px; left: 14px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    pointer-events: none;
  }
  .mock-pill {
    background: #FFF3C4; border: 1px solid #C7A22E; color: #633806;
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
  }
  .mock-note { font-size: 11px; color: rgba(51,50,46,.55); background: rgba(255,254,250,.7); border-radius: 8px; padding: 3px 8px; }

  /* 恢复视角按钮（位于底部导航内，与导航按钮同风格） */
  #btn-cam { min-width: 44px; }
  #btn-cam:hover:enabled { background: rgba(51,50,46,.07); color: var(--ink); }
  #btn-cam:disabled { opacity: .35; }

  /* 底部导航 */
  #nav {
    position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 8; display: flex; align-items: center; gap: 6px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 10px; box-shadow: 0 6px 24px rgba(60, 52, 33, .14);
    max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none;
  }
  #nav::-webkit-scrollbar { display: none; }
  #nav button {
    min-height: 44px; border: none; background: transparent; color: var(--ink-2);
    font-size: 14px; font-family: inherit; border-radius: 999px; padding: 6px 12px;
    cursor: pointer; white-space: nowrap; transition: background .15s ease, color .15s ease;
  }
  #nav button:hover { background: rgba(51,50,46,.07); color: var(--ink); }
  #nav button.active { color: #fff; font-weight: 600; }
  #nav button.fpv-on { background: rgba(111,95,192,.16); color: #5B4BA8; font-weight: 600; }
  #nav button:disabled { opacity: .35; cursor: default; }
  #nav .sep { width: 1px; height: 22px; background: var(--line); flex: none; }
  #nav-status {
    font-size: 12px; color: var(--ink-2); padding: 0 8px; white-space: nowrap; flex: none;
    max-width: 170px; overflow: hidden; text-overflow: ellipsis;
  }

  /* 详情面板：桌面右侧 / 移动端底部抽屉 */
  #panel {
    position: absolute; top: 16px; right: 16px; bottom: 86px; width: 400px; z-index: 7;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(60, 52, 33, .18);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(calc(100% + 32px)); transition: transform .35s cubic-bezier(.22,.9,.3,1);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #panel.open { transform: translateX(0); }
  #panel .p-color { height: 8px; flex: none; background: #F4A982; }
  #panel header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px 10px; border-bottom: 1px solid var(--line);
  }
  #panel header .p-badge {
    flex: none; background: #FFF3C4; border: 1px solid #C7A22E; color: #633806;
    font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; letter-spacing: 1px;
  }
  #panel header h2 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; }
  #p-close {
    flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--ink-2); font-size: 17px; cursor: pointer; line-height: 1;
  }
  #p-close:hover { background: rgba(51,50,46,.07); color: var(--ink); }
  #p-back {
    flex: none; display: none; margin: 10px 16px 0; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-size: 13px; cursor: pointer;
    font-family: inherit; width: fit-content;
  }
  #p-back.show { display: block; }
  #p-body { flex: 1; overflow-y: auto; padding: 14px 16px 18px; font-size: 15px; line-height: 1.68; }
  #p-body h3 { margin: 18px 0 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  #p-body h3:first-child { margin-top: 2px; }
  #p-body p { margin: 0 0 10px; }
  #p-body ul { margin: 0 0 12px; padding-left: 20px; }
  #p-body li { margin-bottom: 6px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-left: 4px solid #A79AE0;
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .card .c-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .card .c-sub { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .card .c-hint { font-size: 12px; color: var(--ink-2); }
  .card .c-label { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-top: 12px; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips span {
    background: rgba(111, 95, 192, .1); color: #5A4BA8;
    border: 1px solid rgba(111, 95, 192, .35);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500;
  }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; margin-bottom: 10px; }
  .kv .k { color: var(--ink-2); font-size: 13px; }
  .kv-copy {
    margin-left: 6px; padding: 1px 10px; font-size: 12px; font-family: inherit; line-height: 1.6;
    border: 1px solid rgba(111, 95, 192, .4); background: rgba(111, 95, 192, .08); color: #5B4BA8;
    border-radius: 999px; cursor: pointer; vertical-align: 1px; white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .kv-copy:hover { background: rgba(111, 95, 192, .18); }
  .kv-copy.copied { background: rgba(124, 197, 164, .22); border-color: rgba(63, 143, 102, .5); color: #2E7A55; }
  .job-head { font-weight: 600; }
  .job-time { font-size: 12.5px; color: var(--ink-2); font-weight: 400; margin-left: 8px; }
  .proj-entry {
    width: 100%; text-align: left; cursor: pointer; font-family: inherit; font-size: 15px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-left: 4px solid #A79AE0;
    border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; transition: transform .12s ease, box-shadow .12s ease;
  }
  .proj-entry:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(60,52,33,.10); }
  .proj-entry .pe-title { font-weight: 600; margin-bottom: 3px; }
  .proj-entry .pe-sub { font-size: 13px; color: var(--ink-2); }
  .proj-entry .pe-go { font-size: 12px; color: #6F5FC0; margin-top: 6px; }
  .p-note { font-size: 12.5px; color: var(--ink-2); background: rgba(199,162,46,.10); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }

  @media (max-width: 768px) {
    #panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 70vh;
      border-radius: 20px 20px 0 0; border-left: none; border-right: none; border-bottom: none;
      transform: translateY(110%);
    }
    #panel.open { transform: translateY(0); }
    #p-body { font-size: 15px; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    #nav { bottom: max(8px, env(safe-area-inset-bottom)); padding: 6px 8px; gap: 2px; z-index: 8; }
    #nav button { padding: 6px 9px; font-size: 13px; }
    #nav-status { display: none; }
    .mock-corner { top: 10px; left: 10px; }
    .mock-note { max-width: 44vw; }
  }

    /* 表面 — 米白哑光 */

    --surface-alt: #FBF9F6;
    /* 文字 — 炭灰 */
    --text: #1C1917;
    --text-soft: #44403C;
    --text-muted: #78716C;
    --text-faint: #A8A29E;
    /* 主金 — 拉丝黄铜 */
    --gold: #B8956A;
    --gold-deep: #9A7B52;
    --gold-light: #D4BFA0;
    --gold-soft: #EDE4D3;
    --gold-bg: #FAF6EF;
    /* 强调色 — 深藏青 */
    --navy: #1E2A3A;
    --navy-deep: #141E2B;
    --navy-soft: #2D3B4F;
    --navy-bg: #F0F3F7;
    /* 状态色 — 低饱和 */
    --green: #4A6741;
    --green-soft: #D4DFD0;
    --green-bg: #F3F6F1;
    --amber: #92662A;
    --amber-soft: #E8D5B7;
    --amber-bg: #FAF4EA;
    --red: #8B3A3A;
    --red-soft: #E0C5C5;
    --red-bg: #F8EFEE;
    --stone: #6B6560;
    --stone-soft: #D6D3CF;
    --stone-bg: #F2F0ED;
    /* 线条 */
    --border: #E5DED2;
    --border-soft: #EFEAE2;
    --border-gold: #D4BFA0;
    /* 阴影 — 极克制 */
    --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.04);
    --shadow-md: 0 4px 16px -4px rgba(28, 25, 23, 0.06);
    --shadow-lg: 0 12px 32px -8px rgba(28, 25, 23, 0.08);
    /* 圆角 — 小而精致 */
    --radius-sm: 3px;
    --radius-md: 6px;
    --radius-lg: 8px;
    /* 字体 */
    --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
    --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-serif-cn: 'Noto Serif SC', 'Playfair Display', Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.75;
    padding: 48px 28px 80px;
    position: relative;
    min-height: 100vh;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* 背景 — 极淡亚麻纹理 + 边角柔光 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(184, 149, 106, 0.05) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(30, 42, 58, 0.03) 0%, transparent 50%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.25;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ═══════  排版  ═══════ */
  h1 {
    font-family: var(--font-serif-cn);
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--navy);
    line-height: 1.35;
    text-align: center;
  }

  h1 em {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    color: var(--gold);
    font-size: 0.75em;
    letter-spacing: 0;
    margin: 0 4px;
  }

  h2 {
    font-family: var(--font-serif-cn);
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--navy);
    text-align: center;
    letter-spacing: 0.15em;
    position: relative;
    padding-bottom: 16px;
  }

  h2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 1px;
    background: var(--gold);
  }

  .sub {
    color: var(--text-soft);
    font-size: 13px;
    margin-top: 12px;
    line-height: 1.8;
    font-weight: 400;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ═══════  卡片  ═══════ */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.4s ease;
    position: relative;
  }

  .card:hover {
    box-shadow: var(--shadow-md);
  }

  /* Hero 区 — 大气尊贵 */
  .hero {
    background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
    border: none;
    border-radius: var(--radius-lg);
    padding: 56px 40px 48px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
    color: #fff;
    box-shadow: var(--shadow-lg);
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 50% 80% at 15% 50%, rgba(184, 149, 106, 0.15) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 85% 80%, rgba(184, 149, 106, 0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    top: 24px; left: 24px; right: 24px; bottom: 24px;
    border: 1px solid rgba(184, 149, 106, 0.25);
    border-radius: var(--radius-md);
    pointer-events: none;
  }

  .hero h1 {
    color: #fff;
    position: relative;
    z-index: 1;
    font-weight: 400;
  }

  .hero h1 em {
    color: var(--gold-light);
  }

  .hero .sub {
    color: rgba(255, 255, 255, 0.55);
    position: relative;
    z-index: 1;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  .hero .ornament {
    text-align: center;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 8px;
    margin: 14px 0 4px;
    position: relative;
    z-index: 1;
    opacity: 0.8;
  }

  /* 标签 — 极简金线 */
  .pill {
    display: inline-block;
    padding: 5px 16px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 2px;
    margin-left: 14px;
    vertical-align: middle;
    font-family: var(--font-body);
  }

  .hero .pill {
    color: var(--gold-light);
    border-color: rgba(184, 149, 106, 0.5);
    background: transparent;
  }

  /* ═══════  统计数据  ═══════ */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    margin-bottom: 24px;
    background: var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }

  .stat {
    background: var(--surface);
    padding: 26px 20px 24px;
    text-align: center;
    transition: background 0.3s ease;
    position: relative;
  }

  .stat:hover {
    background: var(--surface-alt);
  }

  .stat::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .stat:hover::after {
    opacity: 1;
  }

  .stat b {
    display: block;
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 400;
    line-height: 1.1;
    color: var(--navy);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .stat span {
    display: block;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 400;
    margin-top: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ═══════  流程步骤  ═══════ */
  .flow {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    margin-bottom: 24px;
    position: relative;
  }

  .flow div {
    background: var(--surface);
    border: 1px solid var(--border);
    border-right: none;
    padding: 20px 18px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-soft);
    transition: all 0.3s ease;
    position: relative;
    font-weight: 400;
  }

  .flow div:first-child {
    border-top-left-radius: var(--radius-lg);
    border-bottom-left-radius: var(--radius-lg);
  }

  .flow div:last-child {
    border-right: 1px solid var(--border);
    border-top-right-radius: var(--radius-lg);
    border-bottom-right-radius: var(--radius-lg);
  }

  .flow div:hover {
    background: var(--gold-bg);
    color: var(--text);
    z-index: 1;
  }

  .flow div span {
    display: block;
    color: var(--gold);
    font-size: 10.5px;
    font-weight: 500;
    margin-bottom: 7px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: var(--font-body);
  }

  /* ═══════  消息卡片  ═══════ */
  .msgs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .msg {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    display: flex;
    flex-direction: column;
    transition: all 0.35s ease;
    position: relative;
  }

  .msg:hover {
    border-color: var(--gold-light);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .msg .from {
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 400;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border-soft);
  }

  .msg .body {
    font-family: var(--font-serif-cn);
    font-size: 14px;
    line-height: 1.85;
    flex: 1;
    color: var(--text-soft);
    font-weight: 400;
    padding: 4px 0 14px;
    font-style: normal;
  }

  /* ═══════  按钮  ═══════ */
  button {
    margin-top: 12px;
    width: 100%;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 11px 0;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }

  button:hover:not(:disabled) {
    background: var(--navy-deep);
    border-color: var(--navy-deep);
  }

  button:disabled {
    background: var(--stone-bg);
    color: var(--text-faint);
    border-color: var(--border);
    cursor: default;
  }

  /* ═══════  回执  ═══════ */
  .rcpt {
    display: none;
    margin-top: 12px;
    background: var(--green-bg);
    border: 1px solid var(--green-soft);
    border-left: 3px solid var(--green);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 12px 16px;
    font-size: 12.5px;
    color: var(--green);
    line-height: 1.75;
    animation: fadeInUp 0.4s ease;
    font-weight: 400;
  }

  .rcpt.show { display: block; }

  .rcpt b {
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.05em;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ═══════  小按钮  ═══════ */
  .mini {
    display: inline-block;
    width: auto;
    margin: 5px 6px 0 0;
    padding: 6px 16px;
    font-size: 11.5px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-weight: 400;
    letter-spacing: 0.05em;
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .mini:hover {
    border-color: var(--gold);
    color: var(--gold-deep);
    background: var(--gold-bg);
  }

  /* ═══════  自由输入  ═══════ */
  .free textarea {
    width: 100%;
    height: 84px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-family: var(--font-serif-cn);
    font-size: 14px;
    resize: vertical;
    margin-bottom: 12px;
    background: var(--surface-alt);
    color: var(--text);
    transition: all 0.3s ease;
    line-height: 1.7;
    font-weight: 400;
  }

  .free textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(184, 149, 106, 0.1);
  }

  .free textarea::placeholder {
    color: var(--text-faint);
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* ═══════  工具栏  ═══════ */
  .bar {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .bar button {
    width: auto;
    margin-top: 0;
    padding: 9px 24px;
  }

  .btn-ghost {
    background: transparent;
    color: var(--navy);
    border-color: var(--navy);
  }

  .btn-ghost:hover:not(:disabled) {
    background: var(--navy);
    color: #fff;
  }

  /* 分段控件 */
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--surface);
  }

  .seg button {
    border: none;
    border-radius: 0;
    margin: 0;
    background: transparent;
    color: var(--text-muted);
    padding: 8px 18px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: none;
  }

  .seg button:hover:not(.on) {
    background: var(--surface-alt);
    color: var(--text-soft);
    box-shadow: none;
    transform: none;
  }

  .seg button.on {
    background: var(--navy);
    color: #fff;
  }

  .lbl {
    font-size: 12.5px;
    color: var(--text-soft);
    font-weight: 400;
    letter-spacing: 0.03em;
  }

  /* ═══════  表格  ═══════ */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    font-weight: 400;
  }

  th {
    text-align: left;
    font-weight: 500;
    color: var(--text-soft);
    padding: 14px 14px;
    border-bottom: 1px solid var(--border-gold);
    white-space: nowrap;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
  }

  td {
    padding: 14px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
    transition: background 0.25s ease;
    color: var(--text-soft);
  }

  tr:hover td {
    background: var(--surface-alt);
  }

  tr:last-child td { border-bottom: none; }

  .grp td {
    font-weight: 500;
    background: var(--surface-alt);
    font-size: 12px;
    color: var(--navy);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: var(--font-body);
  }

  tr.grp:hover td {
    background: var(--surface-alt);
  }

  /* ═══════  状态点与标签  ═══════ */
  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 2px;
  }

  .d-red { background: var(--red); }
  .d-yellow { background: var(--amber); }
  .d-green { background: var(--green); }
  .d-gray { background: var(--stone); }

  .tag {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 2px;
    font-size: 11px;
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }

  .t-red {
    background: var(--red-bg);
    color: var(--red);
    border-color: var(--red-soft);
  }
  .t-yellow {
    background: var(--amber-bg);
    color: var(--amber);
    border-color: var(--amber-soft);
  }
  .t-green {
    background: var(--green-bg);
    color: var(--green);
    border-color: var(--green-soft);
  }
  .t-gray {
    background: var(--stone-bg);
    color: var(--stone);
    border-color: var(--stone-soft);
  }

  .note {
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 400;
    line-height: 1.7;
  }

  .overridden td {
    color: var(--text-faint);
    text-decoration: line-through;
  }

  .empty {
    color: var(--text-faint);
    font-size: 13px;
    padding: 32px 0;
    text-align: center;
    font-weight: 300;
    font-style: italic;
    font-family: var(--font-display);
    letter-spacing: 0.04em;
  }

  /* ═══════  双栏布局  ═══════ */
  .two {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
  }

  /* ═══════  折叠面板  ═══════ */
  details {
    margin-bottom: 20px;
  }

  details summary {
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 400;
    padding: 18px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    list-style: none;
    transition: all 0.3s ease;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-serif-cn);
    letter-spacing: 0.06em;
    box-shadow: var(--shadow-sm);
  }

  details summary:hover {
    border-color: var(--gold-light);
    color: var(--gold-deep);
  }

  details summary::-webkit-details-marker { display: none; }

  details summary::before {
    content: '+';
    color: var(--gold);
    font-size: 16px;
    font-weight: 300;
    transition: all 0.3s ease;
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    font-family: var(--font-body);
  }

  details[open] summary::before {
    content: '−';
  }

  details[open] summary {
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    border-bottom: none;
    background: var(--surface-alt);
  }

  details .inner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    padding: 8px 28px 20px;
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ═══════  时间线  ═══════ */
  .tl {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    position: relative;
    padding: 32px 0 8px;
  }

  .tl::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 5%;
    right: 5%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold) 85%, transparent);
  }

  .tl-i {
    position: relative;
    padding: 0 16px;
    text-align: center;
  }

  .tl-i .d {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--gold);
    transition: all 0.35s ease;
  }

  .tl-i:hover .d {
    transform: translateX(-50%) scale(1.4);
    background: var(--gold);
  }

  .tl-i .w {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 7px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .tl-i .t {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 7px;
    font-family: var(--font-serif-cn);
    color: var(--navy);
    line-height: 1.4;
    letter-spacing: 0.04em;
  }

  .tl-i .x {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.75;
    font-weight: 400;
  }

  /* ═══════  范围说明  ═══════ */
  .scope {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-soft);
    line-height: 1.85;
    font-weight: 400;
  }

  .scope b {
    color: var(--navy);
    font-weight: 500;
    font-family: var(--font-serif-cn);
    letter-spacing: 0.05em;
  }

  .risk td:first-child { white-space: nowrap; }

  /* ═══════  底部说明  ═══════ */
  .foot {
    color: var(--text-soft);

    font-weight: 400;

  @keyframes riseIn {

  /* ═══════  响应式  ═══════ */

<body>
<div class="wrap">

  \x3C!-- ═══  Hero  ═══ -->
  <div class="card hero">
    <div class="ornament">❖ ❖ ❖</div>
    <h1>酒店早餐订单<em>&amp;</em>风险评估<span class="pill">Prototype</span></h1>
    <div class="sub">非结构化下单 → 结构化订单 · 自动回执 · 需求预测比对 · 人工复核闭环 · 分供应商采购汇总</div>
  </div>

  \x3C!-- ═══  统计数据  ═══ -->
  <div class="stats">
    <div class="stat" id="stat1"><b id="s1">0</b><span>已解析订单行</span></div>
    <div class="stat" id="stat2"><b id="s2">0</b><span>待人工复核项</span></div>
    <div class="stat" id="stat3"><b id="s3">0</b><span>预测偏离预警</span></div>
    <div class="stat" id="stat4"><b id="s4">0</b><span>替代人工耗时 · 分钟/天</span></div>
  </div>

  \x3C!-- ═══  流程步骤  ═══ -->
  <div class="flow">
    <div><span>Step 01</span>语义解析<br>门店 / SKU / 数量 / 变更指令</div>
    <div><span>Step 02</span>别名映射<br>口语 → SKU 主数据</div>
    <div><span>Step 03</span>规则校验<br>偏离预警线 → 标红</div>
    <div><span>Step 04</span>预测比对<br>自动回执防漏单</div>
    <div><span>Step 05</span>复核闭环<br>人工确认 → 采购汇总</div>
  </div>

  \x3C!-- ═══  知识库折叠  ═══ -->
  <details>
    <summary>知识库 · SKU 主数据与别名映射表</summary>
    <div class="inner">
      <table>
        <thead><tr><th>SKU</th><th>常见口语别名</th><th>单位</th><th>供应商</th><th>单客消耗系数</th></tr></thead>
        <tbody id="kb"></tbody>
      </table>
    </div>
  </details>

  \x3C!-- ═══  消息输入  ═══ -->
  <div class="card">
    <h2>门店原始下单消息</h2>
    <div class="msgs">
      <div class="msg">
        <div class="from">福田店 · 李经理 · 微信群</div>
        <div class="body">明天早上还是老样子，加两箱牛奶，香蕉多来点，上次那个面包不要了</div>
        <button onclick="parse(1, this)">解析此条</button>
        <div class="rcpt" id="rc1"></div>
      </div>
      <div class="msg">
        <div class="from">王总 · 微信私聊</div>
        <div class="body">明早 8 个团队客，6:30 开餐，按上周三的标准备</div>
        <button onclick="parse(2, this)">解析此条</button>
        <div class="rcpt" id="rc2"></div>
      </div>
      <div class="msg">
        <div class="from">福田店 · 李经理 · 微信群</div>
        <div class="body">鸡蛋减半，昨天剩太多了，另外临时加 5 份素食餐</div>
        <button onclick="parse(3, this)">解析此条</button>
        <div class="rcpt" id="rc3"></div>
      </div>
    </div>
  </div>

  \x3C!-- ═══  自由输入  ═══ -->
  <div class="card free">
    <h2>自由输入测试</h2>
    <p class="sub" style="margin-top:-10px;margin-bottom:16px">考察泛化能力，识别不了会转人工 —— 这本身就是设计。</p>
    <textarea id="freeText" placeholder="例如：福田店明天加三箱牛奶，鸡蛋不要了 / 王总来点酸奶 / 深圳湾店鸡蛋减半"></textarea>
    <button style="width:auto;padding:9px 24px" onclick="parseFree()">解析这句话</button>
    <div class="rcpt" id="rcFree" style="margin-top:14px"></div>
  </div>

  \x3C!-- ═══  工具栏  ═══ -->
  <div class="card">
    <div class="bar">
      <button class="btn-ghost" onclick="parseAll()">一键全部解析</button>
      <button class="btn-ghost" onclick="reset()">重置</button>
      <span class="lbl">异常判定阈值：</span>
      <span class="seg" id="seg">
        <button onclick="setTh(0.3, this)">±30%</button>
        <button class="on" onclick="setTh(0.5, this)">±50%</button>
        <button onclick="setTh(0.8, this)">±80%</button>
      </span>
      <span class="lbl" style="color:var(--text-faint);font-size:10.5px">参数位，非硬编码</span>
    </div>
  </div>

  \x3C!-- ═══  输出 1 & 2  ═══ -->
  <div class="two">
    <div class="card">
      <h2>结构化订单</h2>
      <table>
        <thead><tr><th>门店</th><th>SKU</th><th>数量</th><th>状态</th><th>解析依据</th></tr></thead>
        <tbody id="orders"><tr><td colspan="5" class="empty">点击上方「解析此条」开始</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>人工复核队列</h2>
      <p class="sub" style="margin-top:-12px;margin-bottom:14px;font-size:10.5px;letter-spacing:0.1em">建议响应时限 30 分钟</p>
      <table>
        <thead><tr><th>异常项</th><th>处理建议与操作</th></tr></thead>
        <tbody id="exc"><tr><td colspan="2" class="empty">暂无</td></tr></tbody>
      </table>
    </div>
  </div>

  \x3C!-- ═══  输出 3 & 4  ═══ -->
  <div class="two">
    <div class="card">
      <h2>需求预测比对</h2>
      <p class="sub" style="margin-top:-12px;margin-bottom:14px;font-size:10.5px;letter-spacing:0.1em">在住人数驱动</p>
      <table>
        <thead><tr><th>门店</th><th>SKU</th><th>预测建议</th><th>实订</th><th>差异</th><th>提示</th></tr></thead>
        <tbody id="fc"><tr><td colspan="6" class="empty">暂无</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>次日采购汇总</h2>
      <p class="sub" style="margin-top:-12px;margin-bottom:14px;font-size:10.5px;letter-spacing:0.1em">按供应商分组</p>
      <table>
        <thead><tr><th>供应商 / SKU</th><th>合计</th><th>说明</th></tr></thead>
        <tbody id="sum"><tr><td colspan="3" class="empty">暂无</td></tr></tbody>
      </table>
    </div>
  </div>

  \x3C!-- ═══  路线图  ═══ -->
  <div class="card">
    <h2>落地路线图 · 十二周五里程碑</h2>
    <div class="tl">
      <div class="tl-i"><span class="d"></span><div class="w">W2 · 11/13</div><div class="t">M1 基线确认</div><div class="x">端到端流程图 + 12 项指标基线，业务方签字</div></div>
      <div class="tl-i"><span class="d"></span><div class="w">W4 · 11/27</div><div class="t">M2 主数据就绪</div><div class="x">SKU 主数据 / 别名表 / 单客消耗系数</div></div>
      <div class="tl-i"><span class="d"></span><div class="w">W6 · 12/11</div><div class="t">M3 MVP 通过</div><div class="x">影子运行 5 个工作日，准确率 ≥ 95%</div></div>
      <div class="tl-i"><span class="d"></span><div class="w">W10 · 01/08</div><div class="t">M4 预测上线</div><div class="x">预测比对模块，MAPE ≤ 30%</div></div>
      <div class="tl-i"><span class="d"></span><div class="w">W12 · 01/22</div><div class="t">M5 验收交付</div><div class="x">全线切换 + SOP 培训 + 项目复盘</div></div>
    </div>
    <div class="scope">
      <b>明确不做什么（防范围蔓延）</b>：供应商寻源与比价 · 配送路径优化 · 结算系统改造 · <b>预测自动决策（只提示不决策）</b> · 替换现有 ERP
    </div>
    <table class="risk" style="margin-top:20px">
      <thead><tr><th>关键风险</th><th>应对 / 降级方案</th></tr></thead>
      <tbody>
        <tr><td><span class="dot d-red"></span>无 API，历史订单取不到</td><td class="note">降级为 RPA 抓取或人工补录；「按上周 X 标准」类指令先转人工</td></tr>
        <tr><td><span class="dot d-yellow"></span>一线不配合、没时间</td><td class="note">让一线参与设计；定位为「去掉抄录，留判断」，不谈替代</td></tr>
        <tr><td><span class="dot d-red"></span>食安与金额出错不可逆</td><td class="note">强制人工签字位 + 全链路留痕；宁可慢，不可逆的错不能犯</td></tr>
      </tbody>
    </table>
  </div>

  \x3C!-- ═══  底部说明  ═══ -->
  <div class="card foot">
    <p><strong>预测逻辑</strong>：预测建议量 = 在住人数 × 早餐渗透率 × 单客消耗系数。福田店在住 186 人 × 62% ≈ 115 人；深圳湾店在住 240 人 × 58% + 团队客 8 人 ≈ 147 人。</p>
    <p><strong>自动回执（防漏单）</strong>：每条消息解析后自动生成回执发回门店方确认，形成双向闭环；N 分钟未回复则触发电话确认（N 按贵司习惯配置）。漏单比错单更可怕，回执是最后一道兜底。</p>
    <p><strong>人工复核闭环</strong>：红色项不进自动采购；复核人可「确认原量」或「按建议量调整」，确认后进入采购汇总 —— 机器拦截、人决策、结果回写。</p>
    <p><strong>风控规则</strong>：数量偏离项在汇总中暂按预测建议量列示（不缺货也不冒进），整项取消与非标品不计入；黄色项进入汇总但标注待确认。</p>
    <p><strong>语音单</strong>：微信语音先经语音转文字（ASR）再进步骤 1，置信度低的转写结果直接转人工。</p>
    <p><strong>说明</strong>：本原型用于展示设计逻辑。SKU、门店、在住人数、消耗系数、耗时均为虚构示例值；预置消息与自由输入的解析均由规则与映射表生成，实际部署时步骤 1 接入大模型 API 做语义解析，步骤 2–4 保留规则层做确定性校验。所有参数需以真实业务数据校准。</p>
  </div>

</div>

<script>
var STORES = {
  '福田店':   { occ:186, rate:0.62, extra:0, keys:['福田'] },
  '深圳湾店': { occ:240, rate:0.58, extra:8, keys:['深圳湾','王总'] }
};

var SKU = {
  MILK:   { name:'鲜牛奶 950ml', alias:'牛奶 / 纯牛奶 / 鲜奶 / 奶', unit:'箱', supplier:'晨光乳业', pp:0.020 },
  BANANA: { name:'香蕉',         alias:'香蕉 / 帝王蕉 / 小米蕉',    unit:'kg', supplier:'鲜果源',   pp:0.045 },
  BREAD:  { name:'吐司面包',     alias:'面包 / 吐司 / 土司',        unit:'袋', supplier:'面包工坊', pp:0.070 },
  EGG:    { name:'鸡蛋',         alias:'鸡蛋 / 蛋 / 鲜蛋',          unit:'托', supplier:'德青源',   pp:0.035 },
  VEGE:   { name:'时蔬拼盘',     alias:'蔬菜 / 青菜 / 时蔬',        unit:'份', supplier:'鲜果源',   pp:0.170 },
  YOGURT: { name:'酸奶 100g',    alias:'酸奶 / 酸牛奶',             unit:'盒', supplier:'晨光乳业', pp:0.260 },
  CONGEE: { name:'白粥原料包',   alias:'粥 / 白粥 / 粥料',          unit:'份', supplier:'中央厨房', pp:0.350 },
  VMEAL:  { name:'素食餐',       alias:'素餐 / 素食 / 斋餐',        unit:'份', supplier:'中央厨房', pp:0 }
};

var DATA = {
  1: { store:'福田店', items:[
    { sku:'MILK',   qty:4,   kind:'computed', why:'常订 + "加两箱"' },
    { sku:'BANANA', qty:6.5, kind:'fuzzy',    why:'"多来点"为模糊量，按建议量 ×1.3 取整' },
    { sku:'BREAD',  qty:0,   kind:'cancel',   why:'"上次那个面包不要了" → 整项取消，需确认是否永久下架' },
    { sku:'EGG',    qty:4,   kind:'computed', why:'常订清单' },
    { sku:'VEGE',   qty:20,  kind:'computed', why:'常订清单' },
    { sku:'YOGURT', qty:30,  kind:'computed', why:'常订清单' },
    { sku:'CONGEE', qty:40,  kind:'computed', why:'常订清单' }
  ]},
  2: { store:'深圳湾店', items:[
    { sku:'MILK',   qty:3,  kind:'history', why:'取上周三订单量，含团队客 8 人' },
    { sku:'BREAD',  qty:12, kind:'history', why:'取上周三订单量' },
    { sku:'EGG',    qty:6,  kind:'history', why:'取上周三订单量' },
    { sku:'YOGURT', qty:40, kind:'history', why:'取上周三订单量' }
  ], meta:[
    { t:'门店识别', v:'"王总" → 深圳湾店（人名映射，需确认）' },
    { t:'配送窗口', v:'6:30 开餐 → 须 5:00 前到店，早于常规窗口' }
  ]},
  3: { store:'福田店', items:[
    { sku:'EGG',   qty:2, kind:'computed', why:'"减半"：常订 4 托 → 2 托；原因：昨日剩余过多' },
    { sku:'VMEAL', qty:5, kind:'nonstd',   why:'非标品，无预测基线，需人工确认配方与产能' }
  ]}
};

var state = { items: [], meta: [], done: {}, th: 0.5, seq: 0 };
var prevStats = { s1: -1, s2: -1, s3: -1, s4: -1 };

function guests(s) { var o = STORES[s]; return Math.round(o.occ * o.rate) + o.extra; }
function forecast(s, k) { return guests(s) * SKU[k].pp; }
function fmt(n) { return (Math.round(n * 10) / 10).toString(); }
function dot(c) { return '<span class="dot d-' + c + '"></span>'; }
function tag(c, t) { return '<span class="tag t-' + c + '">' + t + '</span>'; }

function statusOf(i) {
  if (i.confirmed) return 'green';
  if (i.kind === 'cancel' || i.kind === 'nonstd') return 'red';
  if (i.kind === 'fuzzy' || i.kind === 'history') return 'yellow';
  var f = forecast(i.store, i.sku);
  if (f <= 0) return 'red';
  return Math.abs((i.qty - f) / f) >= state.th ? 'red' : 'green';
}

function pushItems(store, items) {
  var fresh = [];
  items.forEach(function (it) {
    state.items.forEach(function (old) {
      if (!old.overridden && old.store === store && old.sku === it.sku) {
        old.overridden = true;
        old.note = '已被后续指令覆盖';
      }
    });
    var rec = { store:store, sku:it.sku, qty:it.qty, kind:it.kind, why:it.why, overridden:false, note:'', confirmed:false, uid:++state.seq };
    state.items.push(rec);
    fresh.push(rec);
  });
  return fresh;
}

function buildReceipt(store, items) {
  var parts = items.map(function (i) {
    var s = SKU[i.sku], st = statusOf(i);
    var mark = (st === 'red' || st === 'yellow') ? '（待您确认）' : '';
    if (i.qty === 0) return s.name + '：整项取消（待确认是否永久下架）';
    return s.name + ' ' + i.qty + s.unit + mark;
  });
  return '<b>【自动回执 · 已发回门店】</b>' + store + ' 2026-10-16 订单已登记：' + parts.join('；') +
